<style>
  :root {
    --bg-base: #f8fafc;
    --bg-surface: #ffffff;
    --bg-card: #ffffff;
    --bg-hover: #f1f5f9;
    --border-color: #e2e8f0;
    --border-focus: #2563eb;
    
    --text-primary: #0f172a;
    --text-secondary: #334155;
    --text-muted: #64748b;

    --brand-peya: #ff1a53;
    --brand-hover: #e00b41;
    --accent-blue: #2563eb;
    --accent-cyan: #0284c7;
    --accent-green: #059669;
    --accent-amber: #d97706;
    --accent-red: #dc2626;
    --accent-purple: #7c3aed;

    --color-monto-neto: #0f172a;

    --font-sans: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --shadow-card: 0 1px 3px 0 rgba(0, 0, 0, 0.08), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
    --shadow-glow: 0 0 15px rgba(255, 26, 83, 0.12);
  }

  :root[data-theme="light"], body.light-theme {
    --bg-base: #f8fafc;
    --bg-surface: #ffffff;
    --bg-card: #ffffff;
    --bg-hover: #f1f5f9;
    --border-color: #e2e8f0;
    --border-focus: #2563eb;
    
    --text-primary: #0f172a;
    --text-secondary: #334155;
    --text-muted: #64748b;

    --brand-peya: #ff1a53;
    --brand-hover: #e00b41;
    --accent-blue: #2563eb;
    --accent-cyan: #0284c7;
    --accent-green: #059669;
    --accent-amber: #d97706;
    --accent-red: #dc2626;
    --accent-purple: #7c3aed;

    --color-monto-neto: #0f172a;

    --shadow-card: 0 1px 3px 0 rgba(0, 0, 0, 0.08), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
    --shadow-glow: 0 0 15px rgba(255, 26, 83, 0.12);
  }

  :root[data-theme="dark"], body.dark-theme {
    --bg-base: #0a0e17;
    --bg-surface: #111827;
    --bg-card: #162032;
    --bg-hover: #1e2c45;
    --border-color: #24344d;
    --border-focus: #3b82f6;
    
    --text-primary: #f3f4f6;
    --text-secondary: #9ca3af;
    --text-muted: #6b7280;

    --brand-peya: #ff1a53;
    --brand-hover: #e00b41;
    --accent-blue: #3b82f6;
    --accent-cyan: #06b6d4;
    --accent-green: #10b981;
    --accent-amber: #f59e0b;
    --accent-red: #ef4444;
    --accent-purple: #a855f7;

    --color-monto-neto: #f8fafc;

    --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
    --shadow-glow: 0 0 15px rgba(255, 26, 83, 0.25);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-base);
    color: var(--text-primary);
    font-family: var(--font-sans);
    line-height: 1.5;
    min-height: 100vh;
    padding: 24px;
  }

  /* Header & Navigation */
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    margin-bottom: 24px;
    box-shadow: var(--shadow-card);
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-logo {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, var(--brand-peya), #b80036);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.25rem;
    color: #fff;
    box-shadow: var(--shadow-glow);
  }

  .brand-text h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }

  .brand-text span {
    font-size: 0.8rem;
    color: var(--text-secondary);
    font-family: var(--font-mono);
  }

  .header-status {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 9999px;
    font-size: 0.78rem;
    font-family: var(--font-mono);
    font-weight: 500;
    background: rgba(16, 185, 129, 0.1);
    color: var(--accent-green);
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-green);
    box-shadow: 0 0 8px var(--accent-green);
  }

  /* Filters & Controls */
  .control-panel {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 20px 24px;
    margin-bottom: 24px;
  }

  .panel-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .quick-actions {
    display: flex;
    gap: 8px;
  }

  .btn-chip {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-chip:hover, .btn-chip.active {
    background: rgba(59, 130, 246, 0.15);
    border-color: var(--accent-blue);
    color: var(--accent-blue);
  }

  .filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    align-items: flex-end;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group label {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-secondary);
  }

  .form-control {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    padding: 10px 14px;
    font-size: 0.88rem;
    font-family: inherit;
    transition: all 0.2s ease;
  }

  .form-control:focus {
    outline: none;
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.2s ease;
    border: none;
    text-decoration: none;
  }

  .btn-primary {
    background: var(--brand-peya);
    color: #fff;
    box-shadow: var(--shadow-glow);
  }

  .btn-primary:hover {
    background: var(--brand-hover);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
  }

  .btn-secondary:hover {
    background: var(--bg-hover);
    border-color: var(--accent-blue);
  }

  .btn-sm {
    padding: 6px 12px;
    font-size: 0.78rem;
  }

  /* Metric KPI Cards */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .kpi-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    box-shadow: var(--shadow-card);
  }

  .kpi-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .kpi-title {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .kpi-value {
    font-size: 1.6rem;
    font-weight: 700;
    font-family: var(--font-mono);
    color: var(--text-primary);
  }

  .kpi-subtitle {
    font-size: 0.78rem;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .kpi-card.alert {
    border-left: 4px solid var(--accent-red);
  }
  .kpi-card.alert .kpi-value {
    color: var(--accent-red);
  }

  .kpi-card.success {
    border-left: 4px solid var(--accent-green);
  }
  .kpi-card.success .kpi-value {
    color: var(--accent-green);
  }

  /* Data Tables */
  .table-container {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-card);
  }

  .table-header-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border-color);
  }

  .table-title {
    font-size: 1rem;
    font-weight: 600;
  }

  .table-scroll {
    overflow-x: auto;
    max-height: 600px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
    text-align: left;
  }

  thead {
    background: var(--bg-card);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  th {
    padding: 12px 16px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border-color);
    white-space: nowrap;
  }

  td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-color);
    color: var(--text-primary);
    white-space: nowrap;
  }

  tbody tr:hover {
    background: var(--bg-hover);
  }

  .font-mono {
    font-family: var(--font-mono);
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 0.72rem;
    font-weight: 600;
    font-family: var(--font-mono);
    text-transform: uppercase;
  }

  .badge-success {
    background: rgba(16, 185, 129, 0.15);
    color: var(--accent-green);
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .badge-danger {
    background: rgba(239, 68, 68, 0.15);
    color: var(--accent-red);
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  .badge-warning {
    background: rgba(245, 158, 11, 0.15);
    color: var(--accent-amber);
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  .badge-info {
    background: rgba(59, 130, 246, 0.15);
    color: var(--accent-blue);
    border: 1px solid rgba(59, 130, 246, 0.3);
  }

  /* Modal / Reconciliation View */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 24px;
  }

  .modal-overlay.active {
    display: flex;
  }

  .modal-window,
  .modal-container {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 1300px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    overflow: hidden;
    position: relative;
    box-sizing: border-box;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border-color);
    background: var(--bg-card);
    flex-shrink: 0;
  }

  .modal-title h2,
  .modal-title {
    font-size: 1.15rem;
    font-weight: 700;
  }

  .modal-title p,
  .modal-subtitle {
    font-size: 0.8rem;
    color: var(--text-secondary);
  }

  .modal-close,
  .btn-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.5rem;
    cursor: pointer;
    transition: color 0.2s;
    line-height: 1;
    padding: 4px 8px;
  }

  .modal-close:hover,
  .btn-close:hover {
    color: var(--text-primary);
  }

  .modal-body {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
    max-height: calc(90vh - 140px);
  }

  .modal-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-top: 1px solid var(--border-color);
    background: var(--bg-card);
    flex-shrink: 0;
  }

  /* Reconciliation Detail Styling */
  .rec-summary-banner {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    padding: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    margin-bottom: 20px;
  }

  .summary-stat-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .summary-stat-val {
    font-size: 1.25rem;
    font-weight: 700;
    font-family: var(--font-mono);
  }

  .observation-box {
    padding: 14px 18px;
    border-radius: var(--radius-md);
    margin-bottom: 20px;
    font-size: 0.85rem;
  }

  .observation-box.alert {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
  }

  .observation-box.success {
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.3);
    color: #86efac;
  }

  /* Loading Spinner */
  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-state {
    text-align: center;
    padding: 40px;
    color: var(--text-secondary);
  }

  .loading-state .spinner {
    width: 36px;
    height: 36px;
    border-width: 3px;
    border-top-color: var(--brand-peya);
    margin-bottom: 16px;
  }

  /* Navigation Tabs */
  .tab-navigation {
    display: flex;
    gap: 10px;
    background: var(--bg-surface);
    padding: 8px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-color);
    margin-bottom: 24px;
    box-shadow: var(--shadow-card);
  }

  .tab-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 20px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .tab-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }

  .tab-btn.active {
    background: linear-gradient(135deg, rgba(255, 26, 83, 0.15), rgba(59, 130, 246, 0.12));
    border-color: rgba(255, 26, 83, 0.4);
    color: var(--text-primary);
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }

  .tab-btn .tab-icon {
    font-size: 1.15rem;
  }

  .tab-btn .tab-badge {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 12px;
    font-family: var(--font-mono);
  }

  .tab-btn.active .tab-badge {
    background: var(--brand-peya);
    border-color: var(--brand-peya);
    color: #fff;
  }

  .tab-pane {
    display: none;
    animation: fadeIn 0.25s ease-in-out;
  }

  .tab-pane.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Homologation Finder Specific Styles */
  .search-hero {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-card);
  }

  .search-hero-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .search-hero-desc {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }

  .search-bar-wrap {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .search-input-lg {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    padding: 14px 18px;
    font-size: 1.05rem;
    font-family: inherit;
    transition: all 0.2s ease;
  }

  .search-input-lg:focus {
    outline: none;
    border-color: var(--brand-peya);
    box-shadow: 0 0 0 3px rgba(255, 26, 83, 0.25);
  }

  .loc-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.35);
    color: var(--accent-green);
    padding: 4px 10px;
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    font-weight: 600;
  }

  .loc-badge.empty {
    background: rgba(156, 163, 175, 0.1);
    border-color: rgba(156, 163, 175, 0.3);
    color: var(--text-muted);
  }

  .btn-copy {
    background: transparent;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    color: var(--text-secondary);
    padding: 2px 6px;
    font-size: 0.72rem;
    cursor: pointer;
    margin-left: 6px;
    transition: all 0.15s ease;
  }

  .btn-copy:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
    border-color: var(--accent-blue);
  }

  .tag-code {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    font-weight: 600;
  }

  .tag-code.sku {
    background: rgba(59, 130, 246, 0.15);
    color: var(--accent-blue);
    border: 1px solid rgba(59, 130, 246, 0.3);
  }

  .tag-code.supplier {
    background: rgba(245, 158, 11, 0.15);
    color: var(--accent-amber);
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  .tag-code.ean {
    background: rgba(6, 182, 212, 0.15);
    color: var(--accent-cyan);
    border: 1px solid rgba(6, 182, 212, 0.3);
  }

  /* Switch Toggle Switch */
  .switch {
    position: relative;
    display: inline-block;
    width: 48px;
    height: 26px;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #334155;
    transition: .3s;
    border-radius: 26px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 4px;
    bottom: 4px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
  }
  input:checked + .slider {
    background-color: var(--accent-green);
  }
  input:checked + .slider:before {
    transform: translateX(22px);
  }

  /* Cockpit & Hub Styles */
  .cockpit-header-hub {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .hub-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .hub-card:hover {
    border-color: rgba(59, 130, 246, 0.4);
    transform: translateY(-2px);
  }
  .hub-card-title {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .hub-card-main {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hub-card-sub {
    font-size: 0.8rem;
    color: var(--text-secondary);
  }

  .cockpit-subnav {
    display: flex;
    gap: 8px;
    padding: 6px 10px;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    margin-bottom: 16px;
    overflow-x: auto;
  }
  .cockpit-subnav-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cockpit-subnav-btn:hover {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.04);
  }
  .cockpit-subnav-btn.active {
    background: rgba(59, 130, 246, 0.15);
    border-color: var(--accent-blue);
    color: var(--accent-blue);
  }

  /* Estilos para Cruce Multinivel y Desglose a Menor Escala en Aforos */
  .aforo-detail-row {
    background: rgba(17, 24, 39, 0.7);
    border-bottom: 2px solid var(--border-color);
  }
  .aforo-drilldown-box {
    padding: 16px 20px;
    background: #0d131f;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    margin: 8px 12px 14px 12px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
  }
  .drilldown-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .drilldown-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .drilldown-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .drilldown-tab-btn {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    padding: 5px 12px;
    border-radius: var(--radius-sm);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .drilldown-tab-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-primary);
  }
  .drilldown-tab-btn.active {
    background: rgba(59, 130, 246, 0.2);
    border-color: var(--accent-blue);
    color: var(--accent-blue);
  }
  .drilldown-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }
  .drilldown-table th {
    background: rgba(0, 0, 0, 0.3);
    padding: 8px 10px;
    text-align: left;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border-color);
  }
  .drilldown-table td {
    padding: 8px 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  }
  .btn-drilldown-toggle {
    background: rgba(59, 130, 246, 0.12);
    border: 1px solid rgba(59, 130, 246, 0.35);
    color: var(--accent-blue);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.2s ease;
  }
  .btn-drilldown-toggle:hover {
    background: var(--accent-blue);
    color: white;
  }
  .btn-drilldown-toggle.expanded {
    background: rgba(239, 68, 68, 0.12);
    border-color: rgba(239, 68, 68, 0.35);
    color: #fca5a5;
  }
  .btn-drilldown-toggle.expanded:hover {
    background: var(--accent-red);
    color: white;
  }

  /* ======================================================== */
  /* DISEÑO MODULAR UNIFICADO (PANTALLA ÚNICA CON ACORDEONES) */
  /* ======================================================== */
  .quick-nav-bar {
    position: sticky;
    top: 12px;
    z-index: 99;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: rgba(17, 24, 39, 0.94);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    flex-wrap: wrap;
    gap: 10px;
  }
  .quick-nav-links {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .quick-nav-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .quick-nav-btn:hover {
    background: rgba(59, 130, 246, 0.15);
    color: var(--text-primary);
    border-color: rgba(59, 130, 246, 0.4);
  }
  .quick-nav-btn.active {
    background: var(--accent-blue);
    color: #fff;
    border-color: var(--accent-blue);
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
  }
  .quick-nav-actions {
    display: flex;
    gap: 8px;
  }

  /* Tarjetas Modulares Plegables */
  .modular-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    margin-bottom: 20px;
    overflow: hidden;
    box-shadow: var(--shadow-card);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .modular-card:hover {
    border-color: rgba(59, 130, 246, 0.35);
  }
  .modular-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0) 100%);
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid transparent;
    transition: background 0.2s ease;
  }
  .modular-header:hover {
    background: rgba(255, 255, 255, 0.05);
  }
  .modular-card.open .modular-header {
    border-bottom-color: var(--border-color);
    background: rgba(255, 255, 255, 0.02);
  }
  .modular-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-primary);
  }
  .modular-title .mod-icon {
    font-size: 1.25rem;
  }
  .modular-meta {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mod-toggle-arrow {
    width: 28px;
    height: 28px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-secondary);
    font-size: 0.8rem;
    transition: transform 0.25s ease, background 0.2s ease;
  }
  .modular-card.open .mod-toggle-arrow {
    transform: rotate(180deg);
    color: var(--accent-blue);
    background: rgba(59, 130, 246, 0.15);
  }
  .modular-body {
    padding: 20px;
    display: none;
  }
  .modular-card.open .modular-body {
    display: block;
    animation: fadeInSlide 0.2s ease;
  }
  /* ======================================================== */
  /* ESTILOS CONCILIADOR INTERACTIVO 1 A 1 (OC, REC, FACTURA) */
  /* ======================================================== */
  .recon-upload-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .upload-card {
    background: rgba(255, 255, 255, 0.02);
    border: 1px dashed var(--border-color);
    border-radius: var(--radius-md);
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: all 0.2s ease;
    position: relative;
  }
  .upload-card:hover {
    border-color: var(--accent-blue);
    background: rgba(59, 130, 246, 0.04);
  }
  .upload-card.loaded {
    border-style: solid;
    border-color: rgba(16, 185, 129, 0.5);
    background: rgba(16, 185, 129, 0.03);
  }
  .upload-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .upload-card-title {
    font-size: 0.95rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-primary);
  }
  .dropzone-box {
    border: 1px dashed rgba(255, 255, 255, 0.15);
    border-radius: var(--radius-sm);
    padding: 14px;
    text-align: center;
    background: rgba(0, 0, 0, 0.2);
    cursor: pointer;
    transition: all 0.2s ease;
    margin-bottom: 10px;
  }
  .dropzone-box:hover {
    border-color: var(--accent-cyan);
    background: rgba(6, 182, 212, 0.08);
  }
  .dropzone-icon {
    font-size: 1.6rem;
    margin-bottom: 4px;
    display: block;
  }
  .dropzone-text {
    font-size: 0.8rem;
    color: var(--text-secondary);
  }
  .upload-summary {
    font-size: 0.78rem;
    color: var(--text-secondary);
    background: rgba(0, 0, 0, 0.25);
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    margin-top: 8px;
    line-height: 1.4;
  }
  .recon-result-banner {
    padding: 16px 20px;
    border-radius: var(--radius-md);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .recon-result-banner.danger {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.18) 0%, rgba(220, 38, 38, 0.08) 100%);
    border: 1px solid rgba(239, 68, 68, 0.4);
    box-shadow: 0 4px 20px rgba(239, 68, 68, 0.15);
  }
  .recon-result-banner.success {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.18) 0%, rgba(5, 150, 105, 0.08) 100%);
    border: 1px solid rgba(16, 185, 129, 0.4);
    box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15);
  }
  .diff-badge-neg {
    color: #fca5a5;
    background: rgba(239, 68, 68, 0.15);
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
  }
  .diff-badge-pos {
    color: #86efac;
    background: rgba(16, 185, 129, 0.15);
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
  }
  .diff-badge-zero {
    color: var(--text-muted);
  }

  /* Cockpit Unificado (Módulo Único para Todo) */
  .unified-cockpit-header {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 20px 24px;
    box-shadow: var(--shadow-card);
  }
  .cockpit-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    overflow: hidden;
    margin-bottom: 24px;
    transition: border-color 0.2s ease;
  }
  .cockpit-card:hover {
    border-color: rgba(59, 130, 246, 0.35);
  }
  .cockpit-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0) 100%);
    border-bottom: 1px solid var(--border-color);
  }
  .cockpit-card-body {
    padding: 20px;
  }
  .aforo-banner-box {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    transition: all 0.25s ease;
  }
  .aforo-banner-box.whitelist {
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.08) 0%, rgba(59, 130, 246, 0.04) 100%);
    border-color: rgba(168, 85, 247, 0.35);
  }
  .aforo-banner-box.retencion {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.08) 0%, rgba(220, 38, 38, 0.04) 100%);
    border-color: rgba(239, 68, 68, 0.35);
  }

  /* ======================================================== */
  /* ESTILOS DEL FLUJO GUIADO (3 PASOS LIMPIOS Y ORDENADOS)   */
  /* ======================================================== */
  .wizard-progress-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 10px 16px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-card);
    gap: 12px;
  }
  .wizard-step {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid transparent;
    user-select: none;
    background: transparent;
  }
  .wizard-step.active {
    background: rgba(59, 130, 246, 0.12);
    border-color: rgba(59, 130, 246, 0.4);
    box-shadow: 0 2px 10px rgba(59, 130, 246, 0.15);
  }
  .wizard-step.completed {
    background: rgba(16, 185, 129, 0.08);
    border-color: rgba(16, 185, 129, 0.3);
  }
  .wizard-step-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.9rem;
    background: #e2e8f0;
    color: var(--text-secondary);
    transition: all 0.2s ease;
  }
  .wizard-step.active .wizard-step-circle {
    background: var(--accent-blue);
    color: #fff;
    box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
  }
  .wizard-step.completed .wizard-step-circle {
    background: var(--accent-green);
    color: #fff;
  }
  .wizard-step-info {
    display: flex;
    flex-direction: column;
  }
  .wizard-step-title {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text-primary);
  }
  .wizard-step-sub {
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .wizard-step.active .wizard-step-title {
    color: var(--accent-cyan);
  }
  .wizard-step-arrow {
    color: var(--text-muted);
    font-size: 1.1rem;
  }

  .step-pane {
    display: none;
    animation: fadeInSlide 0.25s ease forwards;
  }
  .step-pane.active {
    display: block;
  }

  .document-card-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  @media (max-width: 900px) {
    .document-card-pair {
      grid-template-columns: 1fr;
    }
  }

  .doc-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow-card);
    position: relative;
  }
  .doc-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 12px;
    margin-bottom: 16px;
  }
  .doc-card-title {
    font-size: 1.05rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-primary);
  }
  .doc-prop-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    font-size: 0.88rem;
  }
  .doc-prop-row:last-child {
    border-bottom: none;
  }
  .doc-prop-label {
    color: var(--text-secondary);
  }
  .doc-prop-value {
    color: var(--text-primary);
    font-weight: 600;
  }

  /* ======================================================== */
  /* LIGHT THEME COMPONENT OVERRIDES                          */
  /* ======================================================== */
  [data-theme="light"] .brand-text h1,
  body.light-theme .brand-text h1 {
    color: var(--text-primary);
  }

  [data-theme="light"] .cockpit-card-header,
  body.light-theme .cockpit-card-header {
    background: #f8fafc;
  }

  [data-theme="light"] .wizard-step-circle,
  body.light-theme .wizard-step-circle {
    background: #e2e8f0;
    color: #475569;
  }

  [data-theme="light"] .wizard-step.active .wizard-step-circle,
  body.light-theme .wizard-step.active .wizard-step-circle {
    background: var(--accent-blue);
    color: #ffffff;
  }

  [data-theme="light"] .wizard-step.completed .wizard-step-circle,
  body.light-theme .wizard-step.completed .wizard-step-circle {
    background: var(--accent-green);
    color: #ffffff;
  }

  [data-theme="light"] .doc-prop-row,
  body.light-theme .doc-prop-row {
    border-bottom: 1px solid #f1f5f9;
  }

  [data-theme="light"] .btn-chip,
  body.light-theme .btn-chip {
    background: #f8fafc;
    border-color: #cbd5e1;
    color: #475569;
  }

  [data-theme="light"] .btn-chip:hover,
  [data-theme="light"] .btn-chip.active,
  body.light-theme .btn-chip:hover,
  body.light-theme .btn-chip.active {
    background: #eff6ff;
    border-color: #3b82f6;
    color: #1d4ed8;
  }

  [data-theme="light"] .quick-nav-bar,
  body.light-theme .quick-nav-bar {
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
  }

  [data-theme="light"] .drilldown-table th,
  body.light-theme .drilldown-table th {
    background: #f1f5f9;
  }

  [data-theme="light"] .aforo-drilldown-box,
  body.light-theme .aforo-drilldown-box {
    background: #f8fafc;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
  }

  /* ======================================================== */
  /* ALTO CONTRASTE PARA MONTO NETO & TABLAS EN MODO CLARO    */
  /* ======================================================== */
  .monto-neto-cell,
  #tablaFacturasPaso1 td:nth-child(5),
  #p2InvMontoNeto {
    color: var(--color-monto-neto, #0f172a) !important;
    font-weight: 700 !important;
    font-family: var(--font-mono) !important;
  }

  [data-theme="light"] table thead,
  body.light-theme table thead {
    background: #f1f5f9;
  }

  [data-theme="light"] table th,
  body.light-theme table th {
    background: #f1f5f9;
    color: #334155;
    border-bottom: 2px solid #cbd5e1;
    font-weight: 700;
  }

  [data-theme="light"] table td,
  body.light-theme table td {
    color: #0f172a;
    border-bottom: 1px solid #e2e8f0;
  }

  /* ======================================================== */
  /* TABLA DE AUDITORÍA SKU X SKU - PASO 3 (SUPER-HEADERS)    */
  /* ======================================================== */
  .audit-sku-table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    font-size: 0.82rem;
  }
  .audit-sku-table thead {
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }
  .audit-sku-table .super-header-row th {
    text-align: center;
    font-size: 0.70rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    padding: 6px 10px;
    border-bottom: 2px solid var(--border-color);
    border-right: 1px solid var(--border-color);
    text-transform: uppercase;
  }
  .audit-sku-table .super-header-row th:last-child {
    border-right: none;
  }
  .th-group-item {
    background: rgba(59, 130, 246, 0.08);
    color: var(--accent-blue);
    border-top: 3px solid var(--accent-blue);
  }
  .th-group-qty {
    background: rgba(245, 158, 11, 0.08);
    color: var(--accent-amber);
    border-top: 3px solid var(--accent-amber);
  }
  .th-group-prc {
    background: rgba(139, 92, 246, 0.08);
    color: var(--accent-purple);
    border-top: 3px solid var(--accent-purple);
  }
  .th-group-tot {
    background: rgba(16, 185, 129, 0.08);
    color: var(--accent-green);
    border-top: 3px solid var(--accent-green);
  }
  .th-group-dec {
    background: rgba(239, 68, 68, 0.08);
    color: var(--accent-red);
    border-top: 3px solid var(--accent-red);
  }

  .audit-sku-table .sub-header-row th {
    font-size: 0.69rem;
    font-weight: 700;
    padding: 8px 10px;
    background: var(--bg-card);
    border-bottom: 2px solid var(--border-color);
    border-right: 1px solid rgba(0, 0, 0, 0.05);
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .audit-sku-table td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border-color);
    border-right: 1px solid rgba(0, 0, 0, 0.03);
    vertical-align: middle;
  }
  .audit-sku-table tbody tr:hover {
    background: rgba(59, 130, 246, 0.04);
  }
  .audit-sku-table tbody tr.row-descalce {
