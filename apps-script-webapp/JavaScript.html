  function ejecutarCruceWizard() {
    if (!wizardSelectedInvoice || !wizardAssociatedPo) return;

    showToast('Iniciando conciliación y mapeo de ítems SKU x SKU...', 'info');

    // 1. Si es cruce consolidado y las líneas de factura están vacías, llamar a consolidación de backend
    if (wizardSelectedInvoice.is_consolidado && (!wizardSelectedInvoice.items || wizardSelectedInvoice.items.length === 0)) {
      showToast('Consolidando líneas de ítems de las facturas en servidor...', 'info');
      google.script.run
        .withSuccessHandler((reconRes) => {
          if (reconRes && reconRes.success && reconRes.data) {
            if (reconRes.data.factura && reconRes.data.factura.items && reconRes.data.factura.items.length > 0) {
              wizardSelectedInvoice.items = reconRes.data.factura.items;
            }
            if (reconRes.data.po_info && reconRes.data.po_info.items && reconRes.data.po_info.items.length > 0) {
              wizardAssociatedPo.items = reconRes.data.po_info.items;
            }
            if (reconRes.data.reconciliacion && reconRes.data.reconciliacion.lineas && reconRes.data.reconciliacion.lineas.length > 0) {
              aplicarResultadoReconciliacionDirecta(reconRes.data.reconciliacion);
              return;
            }
          }
          verificarPoItemsYFinalizar();
        })
        .withFailureHandler((err) => {
          console.warn('Aviso consolidando en backend:', err);
          verificarPoItemsYFinalizar();
        })
        .apiConsolidateAndReconcilePo(wizardAssociatedPo.po_order_id);
      return;
    }

    // 2. Si es una factura individual y sus ítems están vacíos
    if (!wizardSelectedInvoice.is_consolidado && (!wizardSelectedInvoice.items || wizardSelectedInvoice.items.length === 0)) {
      showToast('Cargando líneas de la factura y orden de compra...', 'info');
      google.script.run
        .withSuccessHandler((reconRes) => {
          if (reconRes && reconRes.success && reconRes.data) {
            if (reconRes.data.factura && reconRes.data.factura.items && reconRes.data.factura.items.length > 0) {
              wizardSelectedInvoice.items = reconRes.data.factura.items;
            }
            if (reconRes.data.po_info && reconRes.data.po_info.items && reconRes.data.po_info.items.length > 0) {
              wizardAssociatedPo.items = reconRes.data.po_info.items;
            }
            if (reconRes.data.reconciliacion && reconRes.data.reconciliacion.lineas && reconRes.data.reconciliacion.lineas.length > 0) {
              aplicarResultadoReconciliacionDirecta(reconRes.data.reconciliacion);
              return;
            }
          }
          verificarPoItemsYFinalizar();
        })
        .withFailureHandler((err) => {
          console.warn('Aviso reconciliando factura en backend:', err);
          verificarPoItemsYFinalizar();
        })
        .apiRunInvoiceReconciliation(wizardSelectedInvoice.ax_doc_id || wizardSelectedInvoice.folio, wizardAssociatedPo.po_order_id);
      return;
    }

    verificarPoItemsYFinalizar();
  }

  function verificarPoItemsYFinalizar() {
    if ((!wizardAssociatedPo.items || wizardAssociatedPo.items.length === 0) && wizardAssociatedPo.po_order_id) {
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.success && res.data && res.data.items && res.data.items.length > 0) {
            wizardAssociatedPo.items = res.data.items;
          }
          finalizarEjecucionCruce();
        })
        .withFailureHandler(() => {
          finalizarEjecucionCruce();
        })
        .apiGetPurchaseOrder(wizardAssociatedPo.po_order_id);
      return;
    }

    finalizarEjecucionCruce();
  }

  function aplicarResultadoReconciliacionDirecta(recon) {
    if (!recon) return;
    const res = Object.assign({}, recon.resumen, {
      folio_factura: recon.resumen ? recon.resumen.folio_factura : wizardSelectedInvoice.folio,
      proveedor_rut: recon.resumen ? recon.resumen.proveedor_rut : wizardSelectedInvoice.emisor.rut,
      proveedor_nombre: recon.resumen ? recon.resumen.proveedor_nombre : wizardSelectedInvoice.emisor.razon_social,
      fecha_emision: recon.resumen ? recon.resumen.fecha_emision : wizardSelectedInvoice.fecha_emision,
      po_number: recon.resumen ? recon.resumen.po_referencia : wizardAssociatedPo.po_order_id,
      almacen: recon.resumen ? recon.resumen.almacen : wizardAssociatedPo.warehouse_name,
      total_facturado_neto: recon.resumen ? recon.resumen.total_facturado_neto : wizardSelectedInvoice.totales.total,
      total_recepcionado_neto: recon.resumen ? recon.resumen.total_recepcionado_neto : 0,
      monto_referencia_oc: recon.resumen ? recon.resumen.total_facturado_neto : wizardSelectedInvoice.totales.total,
      total_oc_ordenado: recon.resumen ? recon.resumen.total_facturado_neto : wizardSelectedInvoice.totales.total,
      dif_ml: recon.resumen ? (recon.resumen.dif_ml !== undefined ? recon.resumen.dif_ml : (recon.resumen.total_facturado_neto - recon.resumen.total_recepcionado_neto)) : 0,
      total_monto_reclamar: recon.resumen ? recon.resumen.total_monto_a_reclamar : 0,
      lineas: normalizarLineasAuditoria(recon.lineas || []),
      items_oc_no_facturados: recon.items_oc_no_facturados || [],
      po_data: wizardAssociatedPo,
      invoices_source: wizardSelectedInvoice.invoices_source || [wizardSelectedInvoice]
    });

    res.lineas_conformes = res.lineas.filter(l => l.monto_reclamar === 0).length;
    res.lineas_con_descalce = res.lineas.filter(l => l.monto_reclamar > 0).length;
    res.total_descalce_precio = res.lineas.reduce((s, l) => s + (l.monto_nc_precio || 0), 0);
    res.total_faltante_recepcion = res.lineas.reduce((s, l) => s + (l.monto_nc_cantidad || 0), 0);
    res.total_no_en_oc = res.lineas.filter(l => l.estado === 'NO_EN_OC').reduce((s, l) => s + l.monto_reclamar, 0);

    renderizarPaso3Completo(res);
  }

  function finalizarEjecucionCruce() {
    const res = calcularCruce1a1EnCliente(wizardSelectedInvoice, wizardAssociatedPo);
    res.lineas = normalizarLineasAuditoria(res.lineas);
    res.po_data = wizardAssociatedPo;
    res.invoices_source = wizardSelectedInvoice.invoices_source || [wizardSelectedInvoice];
    // OC consolidada: el Dif ML es el de la OC completa (igual que el Paso 1), con impuesto interno en ambos lados.
    // Las líneas conservan su propia suma, sin impuesto, y el pie de la tabla muestra la diferencia entre ambas.
    const difOc = wizardSelectedInvoice.dif_oc;
    if (difOc && difOc.recepcionado > 0) {
      res.dif_ml_lineas = res.dif_ml;
      res.total_facturado_comparable = difOc.facturado;
      res.total_recepcionado_oc = difOc.recepcionado;
      res.dif_ml = difOc.dif;
      res.diferencia_ml = difOc.dif;
      res.diferencia_total_neta = difOc.dif;
    }
    renderizarPaso3Completo(res);
  }

  /**
   * Resumen simple del Paso 3: cifras de facturas / NC / neto / bruto y tabla de documentos de la PO.
   * Neto = Facturas − NC (según CodRef). Bruto = Facturas sin descontar NC. Ambos se muestran siempre.
   */
  function renderizarResumenPaso3(res) {
    if (!res) return;
    const fmt = (n) => '$' + Math.round(Number(n) || 0).toLocaleString('es-CL');
    const setTxt = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
    const docs = Array.isArray(res.invoices_source) ? res.invoices_source : [];
    const esNc = (d) => Boolean(d.es_nc || d.is_nc || d.tipo_dte === 'CL61' || d.tipo_dte === 'NC' || String(d.tipo_documento || '').includes('Crédito'));

    let fac = 0;
    let nc = 0;
    let impFac = 0;
    let impNc = 0;
    docs.forEach(d => {
      if (documentoSinEfecto(d, esNc(d))) return;
      if (esNc(d)) { nc += safeNum(d.monto_neto); impNc += safeNum(d.impuesto_interno); }
      else { fac += safeNum(d.monto_neto); impFac += safeNum(d.impuesto_interno); }
    });
    const hayMontos = (fac + nc) > 0;
    const totRec = safeNum(res.total_recepcionado_oc || res.total_recepcionado_neto);
    const facturas = hayMontos ? fac : safeNum(res.total_facturado_neto);
    const ncs = hayMontos ? nc : 0;
    const facturado = facturas - ncs;

    setTxt('p3StatFacturas', fmt(facturas));
    setTxt('p3StatNcs', ncs > 0 ? '− ' + fmt(ncs) : '$0');
    setTxt('p3StatFacturado', fmt(facturado));
    setTxt('p3StatRecepcionado', fmt(totRec));
    const impuestos = hayMontos ? { fac: impFac, nc: impNc } : { fac: 0, nc: 0 };
    setTxt('p3DescalceNeto', fmt(facturado + impuestos.fac - impuestos.nc - totRec));
    setTxt('p3DescalceBruto', fmt(facturas + impuestos.fac - totRec));
    const notaBase = document.getElementById('p3NotaBase');
    if (notaBase) {
      const hayImpuesto = (impuestos.fac + impuestos.nc) > 0;
      notaBase.style.display = hayImpuesto ? 'block' : 'none';
      notaBase.textContent = hayImpuesto
        ? 'El descalce incluye impuesto interno en facturas (' + fmt(impuestos.fac) + '), notas de crédito (' + fmt(impuestos.nc) + ') y recepción. Las cifras de arriba son netas, sin impuesto.'
        : '';
    }

    // Tabla de documentos (solo si hay más de uno o hay NC)
    const box = document.getElementById('boxDocumentosPaso3');
    const tbody = document.getElementById('tbodyDocumentosPaso3');
    if (!box || !tbody) return;
    while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
    const hayNc = docs.some(esNc);
    if (docs.length === 0 || (docs.length === 1 && !hayNc)) { box.style.display = 'none'; return; }

    const celda = (tr, texto, clase) => {
      const td = document.createElement('td');
      if (clase) td.className = clase;
      td.textContent = texto;
      tr.appendChild(td);
      return td;
    };
    docs.forEach(d => {
      const nota = esNc(d);
      const tr = document.createElement('tr');
      const tdTipo = document.createElement('td');
      const chip = document.createElement('span');
      chip.className = 'p3-chip ' + (nota ? 'p3-chip-warn' : 'p3-chip-info');
      chip.textContent = nota ? 'Nota de crédito' : 'Factura';
      tdTipo.appendChild(chip);
      tr.appendChild(tdTipo);
      celda(tr, String(d.folio || '-'), 'font-mono');
      celda(tr, String(d.fecha || d.fecha_emision || '').slice(0, 10) || '-');

      const neto = safeNum(d.monto_neto);
      let efecto = 'Suma';
      let montoTxt = fmt(neto);
      let montoClase = 'p3-num font-mono';
      if (nota) {
        const cod = d.nc_cod_ref ? ' · CodRef ' + d.nc_cod_ref : '';
        const refs = (d.nc_ref_folios && d.nc_ref_folios.length) ? ' · ref. factura ' + d.nc_ref_folios.join(', ') : '';
        if (d.efecto_nc === 'ANULA') { efecto = 'Anula la factura referenciada' + cod + refs; montoTxt = '$0'; }
        else if (d.efecto_nc === 'SIN_EFECTO_MONTOS') { efecto = 'Sin efecto en montos' + cod; montoTxt = '$0'; }
        else { efecto = 'Descuenta' + cod + refs; montoTxt = '− ' + fmt(neto); montoClase += ' p3-neg'; }
      } else if (d.anulada) {
        efecto = 'Anulada por NC ' + (d.anulada_por_nc || '');
        montoTxt = '$0';
      }
      celda(tr, montoTxt, montoClase);
      celda(tr, efecto, 'p3-muted');
      tbody.appendChild(tr);
    });
    box.style.display = 'block';
  }

  function renderizarPaso3Completo(res) {
    wizardReconResult = res;
    reconActiveResult = res; // para exportar CSV

    // Actualizar encabezado del Paso 3
    const subtext = document.getElementById('p3HeaderSubtext');
    if (subtext) {
      subtext.textContent = `Auditoría entre Factura Folio ${res.folio_factura} y Orden de Compra ${res.po_number} (${res.proveedor_nombre}).`;
    }

    // Actualizar Veredicto y Monto a Reclamar
    const banner = document.getElementById('bannerVeredicto1a1');
    const lblTitulo = document.getElementById('lblVeredictoTitulo');
    const lblDetalle = document.getElementById('lblVeredictoDetalle');
    const lblMonto = document.getElementById('lblMontoReclamarTotal');

    const difMl = Math.round(Number(res.dif_ml !== undefined ? res.dif_ml : (res.diferencia_total_neta !== undefined ? res.diferencia_total_neta : (res.total_facturado_neto - res.total_recepcionado_neto))));
    const montoNc = Math.round(Number(res.total_monto_reclamar !== undefined ? res.total_monto_reclamar : difMl));
    const totFac = Math.round(Number(res.total_facturado_comparable || res.total_facturado_neto || 0));
    const totRec = Math.round(Number(res.total_recepcionado_oc || res.total_recepcionado_neto || 0));

    if (lblMonto) lblMonto.textContent = `$${difMl.toLocaleString('es-CL')} CLP`;

    const lblCorrob = document.getElementById('lblCorroboracionPaso3');
    if (lblCorrob) {
      lblCorrob.innerHTML = `Facturado ($${totFac.toLocaleString('es-CL')}) - Recepcionado ($${totRec.toLocaleString('es-CL')}) = Dif ML: $${difMl.toLocaleString('es-CL')}`;
    }

    if (montoNc > 0 || difMl > 0) {
      if (banner) banner.className = 'recon-result-banner danger';
      if (lblTitulo) lblTitulo.innerHTML = `Descalce confirmado en factura ${res.folio_factura}`;
      if (lblDetalle) lblDetalle.innerHTML = `Se identificaron <strong>${res.lineas_con_descalce} líneas con discrepancias</strong> respecto a la OC ${res.po_number}. Dif ML a reclamar: <strong>$${difMl.toLocaleString('es-CL')} CLP</strong>.`;
    } else {
      if (banner) banner.className = 'recon-result-banner success';
      if (lblTitulo) lblTitulo.innerHTML = `Conciliación conforme (calce 100%)`;
      if (lblDetalle) lblDetalle.innerHTML = `Todas las líneas de la Factura coinciden exactamente en precio y cantidades con la OC ${res.po_number}. Documento conforme para pago.`;
    }

    // KPIs
    const kpiDifMl = document.getElementById('kpiDifMlPaso3');
    const kpiDifMlSubtext = document.getElementById('kpiDifMlSubtext');
    if (kpiDifMl) kpiDifMl.textContent = `$${difMl.toLocaleString('es-CL')}`;
    if (kpiDifMlSubtext) {
      kpiDifMlSubtext.textContent = `Facturado $${totFac.toLocaleString('es-CL')} - Recepcionado $${totRec.toLocaleString('es-CL')}`;
    }

    const kpiPrc = document.getElementById('kpiDescalcePrecio');
    const kpiGr = document.getElementById('kpiFaltanteRecepcion');
    const kpiNoOc = document.getElementById('kpiNoEnOc');

    if (kpiPrc) kpiPrc.textContent = `$${Math.round(res.total_descalce_precio || 0).toLocaleString('es-CL')}`;
    if (kpiGr) kpiGr.textContent = `$${Math.round(res.total_faltante_recepcion || 0).toLocaleString('es-CL')}`;
    if (kpiNoOc) kpiNoOc.textContent = `$${Math.round(res.total_no_en_oc || 0).toLocaleString('es-CL')}`;

    // Conteo filtros
    const cntTodos = document.getElementById('cntLineasTodos');
    const cntDesc = document.getElementById('cntLineasDescalce');
    const cntConf = document.getElementById('cntLineasConformes');

    if (cntTodos) cntTodos.textContent = res.lineas.length;
    if (cntDesc) cntDesc.textContent = res.lineas_con_descalce;
    if (cntConf) cntConf.textContent = res.lineas_conformes;

    // Renderizar tabla
    actualizarPanelControlTransaccionPaso3(res);
    renderizarResumenPaso3(res);
    filtrarTablaPaso3('todos');

    // Mostrar las diferencias debajo de la OC (Paso 2) y llevar la vista hasta ellas
    resultadosCruceVisibles = true;
    irAPasoWizard(2);
    const paneDiferencias = document.getElementById('panePaso3');
    if (paneDiferencias && paneDiferencias.scrollIntoView) paneDiferencias.scrollIntoView({ behavior: 'smooth', block: 'start' });

    // Ejecutar automáticamente el triage inteligente de causas raíz TypeSafe AI si hay descalces
    if (res.lineas_con_descalce > 0) {
      setTimeout(() => {
        ejecutarJevAiAudit(true);
      }, 250);
    }
  }

  let paso3FiltroActivo = 'todos';

  function filtrarTablaPaso3(filtro) {
    if (filtro) paso3FiltroActivo = filtro;
    const activeResult = wizardReconResult || reconActiveResult;
    if (!activeResult || !activeResult.lineas) return;

    const chipTodos = document.getElementById('chipFiltroLineasTodos');
    const chipDesc = document.getElementById('chipFiltroLineasDescalce');
    const chipConf = document.getElementById('chipFiltroLineasConformes');

    if (chipTodos) chipTodos.className = `btn-chip ${paso3FiltroActivo === 'todos' ? 'active' : ''}`;
    if (chipDesc) chipDesc.className = `btn-chip ${paso3FiltroActivo === 'descalces' || paso3FiltroActivo === 'descalce' ? 'active' : ''}`;
    if (chipConf) chipConf.className = `btn-chip ${paso3FiltroActivo === 'conformes' ? 'active' : ''}`;

    const tbody = document.getElementById('tbodyDetalleConciliacion1a1');
    const tfoot = document.getElementById('tfootDetalleConciliacion1a1');
    if (!tbody) return;

    const txtQuery = (document.getElementById('txtFiltroSkuPaso3')?.value || '').toLowerCase().trim();

    // 1. Filtrado por Chip y por Texto de Búsqueda
    const lineasFiltradas = activeResult.lineas.filter(l => {
      // Filtro de chip
      if (paso3FiltroActivo === 'descalces' || paso3FiltroActivo === 'descalce') {
        if (!(l.monto_reclamar > 0 || l.severidad === 'danger' || l.severidad === 'warning')) return false;
      }
      if (paso3FiltroActivo === 'conformes') {
        if (l.monto_reclamar > 0 || l.severidad === 'danger' || l.severidad === 'warning') return false;
      }

      // Filtro de texto
      if (txtQuery) {
        const matchSku = (l.sku || '').toLowerCase().includes(txtQuery);
        const matchCod = (l.codigo || '').toLowerCase().includes(txtQuery);
        const matchEan = (l.ean || '').toLowerCase().includes(txtQuery);
        const matchDesc = (l.descripcion || '').toLowerCase().includes(txtQuery);
        const matchDiag = (l.diagnostico || '').toLowerCase().includes(txtQuery);
        if (!matchSku && !matchCod && !matchEan && !matchDesc && !matchDiag) return false;
      }

      return true;
    });

    if (lineasFiltradas.length === 0) {
      tbody.innerHTML = '<tr><td colspan="15" style="text-align:center; padding:35px; color:var(--text-secondary); font-size:0.9rem;">No se encontraron líneas que coincidan con los criterios de búsqueda o filtro.</td></tr>';
      if (tfoot) tfoot.innerHTML = '';
      return;
    }

    // 2. Renderizar Filas de Auditoría (15 Columnas Estructuradas)
    let html = '';
    let totCantOrd = 0;
    let totCantFac = 0;
    let totCantRec = 0;
    let totDifFaltante = 0;
    let totTotalFac = 0;
    let totTotalValido = 0;
    let totMontoNc = 0;
    let cntDescalces = 0;

    lineasFiltradas.forEach(l => {
      const idxOriginal = activeResult.lineas.indexOf(l);
      totCantOrd += (Number(l.cantidad_ordenada) || 0);
      totCantFac += (Number(l.cantidad_facturada) || 0);
      totCantRec += (Number(l.cantidad_recepcionada) || 0);
      if (l.dif_cantidad < 0) totDifFaltante += Math.abs(l.dif_cantidad);
      totTotalFac += (Number(l.total_facturado) || 0);
      totTotalValido += (Number(l.total_esperado) || 0);
      totMontoNc += (Number(l.monto_reclamar) || 0);
      if (l.monto_reclamar > 0) cntDescalces++;

      // Badges de Estado
      let badgeEstado = '<span class="badge badge-success">CALCE OK</span>';
      if (l.estado === 'FALTANTE_RECEPCION') {
        badgeEstado = '<span class="badge badge-warning" style="background:rgba(245,158,11,0.15); color:var(--accent-amber); border:1px solid rgba(245,158,11,0.3);">FALTANTE BODEGA</span>';
      } else if (l.estado === 'DESCALCE_PRECIO') {
        badgeEstado = '<span class="badge badge-danger">SOBREPRECIO</span>';
      } else if (l.estado === 'DESCALCE_MIXTO') {
        badgeEstado = '<span class="badge badge-danger" style="background:#7f1d1d; color:#fecaca; border:1px solid #b91c1c;">DOBLE DESCALCE</span>';
      } else if (l.estado === 'REVISAR_UOM') {
        badgeEstado = '<span class="badge badge-warning">REVISAR UNIDAD</span>';
      } else if (l.estado === 'NO_EN_OC') {
        badgeEstado = '<span class="badge" style="background:#581c87; color:#f3e8ff; border:1px solid #7e22ce;">NO EN OC</span>';
      } else if (l.estado === 'UOM_EMPAQUE') {
        badgeEstado = `<span class="badge badge-info">FACTOR UOM (x${l.factor_empaque || 24})</span>`;
      }

      // Badges de Diferencias de Cantidad y Precio
      const difQtyClass = l.dif_cantidad < 0 ? 'diff-badge-neg' : (l.dif_cantidad > 0 ? 'diff-badge-pos' : 'diff-badge-zero');
      const difPrcClass = l.dif_precio > 0 ? 'diff-badge-neg' : (l.dif_precio < 0 ? 'diff-badge-pos' : 'diff-badge-zero');

      const difQtyStr = l.dif_cantidad !== 0 ? `<span class="${difQtyClass}">${l.dif_cantidad > 0 ? '+' : ''}${l.dif_cantidad}</span>` : '<span class="diff-badge-zero">0</span>';
      const difPrcStr = l.dif_precio !== 0 ? `<span class="${difPrcClass}">${l.dif_precio > 0 ? '+' : ''}$${Math.round(l.dif_precio).toLocaleString('es-CL')}</span>` : '<span class="diff-badge-zero">$0</span>';

      // Monto NC con desglose
      let montoNcStr = '<span class="diff-badge-zero">$0</span>';
      if (l.monto_reclamar > 0) {
        let desgloseSmall = '';
        if (l.monto_nc_cantidad > 0 && l.monto_nc_precio > 0) {
          desgloseSmall = `<div style="font-size:0.70rem; color:var(--text-secondary); margin-top:2px;">Falt: $${Math.round(l.monto_nc_cantidad).toLocaleString('es-CL')} | Prc: $${Math.round(l.monto_nc_precio).toLocaleString('es-CL')}</div>`;
        } else if (l.monto_nc_cantidad > 0) {
          desgloseSmall = `<div style="font-size:0.70rem; color:var(--text-secondary); margin-top:2px;">Faltante Físico</div>`;
        } else if (l.monto_nc_precio > 0) {
          desgloseSmall = `<div style="font-size:0.70rem; color:var(--text-secondary); margin-top:2px;">Sobreprecio</div>`;
        }
        montoNcStr = `<strong style="color:var(--accent-red); font-size:0.95rem; font-family:var(--font-mono);">$${Math.round(l.monto_reclamar).toLocaleString('es-CL')}</strong>${desgloseSmall}`;
      }

      // Tag de empaque UOM si aplica
      let tagUom = `<span style="font-size:0.72rem; color:var(--text-muted);">${l.unidad_medida || 'UN'}</span>`;
      if (l.is_uom_match) {
        tagUom = `<span class="badge badge-info" style="font-size:0.68rem; padding:1px 5px;">${l.unidad_medida} (x${l.factor_empaque})</span>`;
      }

      const rowClass = l.monto_reclamar > 0 ? 'row-descalce' : '';

      html += `
        <tr class="${rowClass}">
          <td style="font-weight:600; color:var(--text-muted); text-align:center;">${l.linea}</td>
          <td>
            <div class="font-mono" style="font-size:0.80rem; font-weight:700; color:var(--accent-cyan);">${l.sku}</div>
            <div style="font-size:0.72rem; color:var(--text-muted);">EAN: ${l.ean}</div>
          </td>
          <td>
            <div style="font-weight:600; color:var(--text-primary); font-size:0.85rem; line-height:1.25;">${l.descripcion}</div>
            <div style="display:flex; align-items:center; gap:6px; margin-top:3px;">${tagUom}</div>
          </td>
          <td style="text-align:right; font-family:var(--font-mono);">${l.cantidad_ordenada !== undefined ? l.cantidad_ordenada : '-'}</td>
          <td style="text-align:right; font-family:var(--font-mono); font-weight:600;">${l.cantidad_facturada}</td>
          <td style="text-align:right; font-family:var(--font-mono);">${l.cantidad_recepcionada}</td>
          <td style="text-align:right;">${difQtyStr}</td>
          <td style="text-align:right; font-family:var(--font-mono);">$${Math.round(l.costo_oc).toLocaleString('es-CL')}</td>
          <td style="text-align:right; font-family:var(--font-mono); font-weight:600;">$${Math.round(l.precio_facturado).toLocaleString('es-CL')}</td>
          <td style="text-align:right;">${difPrcStr}</td>
          <td style="text-align:right; font-family:var(--font-mono); font-weight:700;">$${Math.round(l.total_facturado).toLocaleString('es-CL')}</td>
          <td style="text-align:right; font-family:var(--font-mono); color:var(--accent-green); font-weight:600;">$${Math.round(l.total_esperado).toLocaleString('es-CL')}</td>
          <td style="text-align:right;">${montoNcStr}</td>
          <td style="text-align:center;">${badgeEstado}</td>
          <td style="font-size:0.78rem; color:var(--text-secondary); line-height:1.35; min-width:240px; max-width:320px;">
            <div style="margin-bottom:6px;">${l.diagnostico}</div>
            ${l.jev_root_cause ? `<div style="display:inline-flex; align-items:center; gap:5px; font-size:0.70rem; background:rgba(124,58,237,0.12); color:var(--accent-purple); padding:2px 8px; border-radius:4px; font-weight:700; margin-bottom:6px; border:1px solid rgba(124,58,237,0.3);"><span>⚡ Jev AI:</span> ${l.jev_root_cause} (${l.jev_confidence || 95}%)</div><br>` : ''}
            <button type="button" class="btn-drilldown-calc" onclick="abrirModalCalculoLinea(${idxOriginal})">
              📐 Ver Desglose & Fórmula
            </button>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;

    // 3. Renderizar Totales de Auditoría en el Footer (tfoot)
    if (tfoot) {
      const faltanteTotalStr = totDifFaltante > 0 ? `<span class="diff-badge-neg">-${totDifFaltante} unids</span>` : '<span class="diff-badge-zero">0 unids</span>';
      const montoTotalNcStr = totMontoNc > 0
        ? `<strong style="color:var(--accent-red); font-size:1.05rem; font-family:var(--font-mono);">$${Math.round(totMontoNc).toLocaleString('es-CL')}</strong>`
        : '<span style="color:var(--accent-green); font-weight:700; font-family:var(--font-mono);">$0</span>';

      const difMlTotal = Math.round(totTotalFac - totTotalValido);
      const difMlBadge = difMlTotal > 0
        ? `<strong style="color:var(--accent-red); font-size:1.05rem; font-family:var(--font-mono);">$${difMlTotal.toLocaleString('es-CL')}</strong>`
        : (difMlTotal < 0 ? `<span style="color:var(--accent-cyan); font-weight:700; font-family:var(--font-mono);">-$${Math.abs(difMlTotal).toLocaleString('es-CL')}</span>` : '<span style="color:var(--accent-green); font-weight:700; font-family:var(--font-mono);">$0</span>');

      tfoot.innerHTML = `
        <tr>
          <td colspan="3" style="font-weight:800; color:var(--text-primary); text-transform:uppercase; letter-spacing:0.04em;">
            TOTALES AUDITORÍA (${lineasFiltradas.length} Ítems)
          </td>
          <td style="text-align:right; font-family:var(--font-mono); font-weight:700;">${totCantOrd.toLocaleString('es-CL')}</td>
          <td style="text-align:right; font-family:var(--font-mono); font-weight:800;">${totCantFac.toLocaleString('es-CL')}</td>
          <td style="text-align:right; font-family:var(--font-mono); font-weight:700;">${totCantRec.toLocaleString('es-CL')}</td>
          <td style="text-align:right;">${faltanteTotalStr}</td>
          <td colspan="3" style="text-align:center; font-size:0.75rem; color:var(--text-muted);">-</td>
          <td style="text-align:right; font-family:var(--font-mono); font-weight:800; font-size:0.95rem;">$${Math.round(totTotalFac).toLocaleString('es-CL')}</td>
          <td style="text-align:right; font-family:var(--font-mono); font-weight:800; color:var(--accent-green); font-size:0.95rem;">$${Math.round(totTotalValido).toLocaleString('es-CL')}</td>
          <td style="text-align:right;">${montoTotalNcStr}</td>
          <td style="text-align:center;">
            ${totMontoNc > 0 ? '<span class="badge badge-danger">CON RECLAMOS</span>' : '<span class="badge badge-success">TODO CONFORME</span>'}
          </td>
          <td style="font-size:0.80rem; font-weight:700; color:var(--text-primary);">
            ${cntDescalces > 0 ? `🚨 ${cntDescalces} línea(s) con discrepancia` : '✅ 100% Calce conforme'}
          </td>
        </tr>
        <tr style="background:rgba(239,68,68,0.06); border-top:1px dashed rgba(239,68,68,0.3);">
          <td colspan="10" style="font-weight:700; color:var(--text-secondary); text-align:right; font-size:0.82rem;">
            ⚖️ CORROBORACIÓN MATEMÁTICA EN MONEDA LOCAL (DIF ML = FACTURADO NETO - RECEPCIONADO):
          </td>
          <td style="text-align:right; font-family:var(--font-mono); font-weight:800; font-size:0.95rem; color:var(--text-primary);">$${Math.round(totTotalFac).toLocaleString('es-CL')}</td>
          <td style="text-align:right; font-family:var(--font-mono); font-weight:800; font-size:0.95rem; color:var(--accent-green);">$${Math.round(totTotalValido).toLocaleString('es-CL')}</td>
          <td style="text-align:right;">${difMlBadge}</td>
          <td colspan="2" style="font-size:0.80rem; font-weight:700; color:var(--accent-red);">
            ${difMlTotal > 0 ? `⚠️ Dif ML Reclamable: $${difMlTotal.toLocaleString('es-CL')} CLP` : (difMlTotal < 0 ? `ℹ️ Sobrellegada: -$${Math.abs(difMlTotal).toLocaleString('es-CL')} CLP` : '✅ Cuadratura Exacta $0 CLP')}
          </td>
        </tr>
      `;

      // Conciliación con el Dif ML de la OC: las líneas suman sin impuesto interno y solo lo facturado
      const difOcActiva = activeResult.dif_ml_lineas !== undefined ? Math.round(Number(activeResult.dif_ml)) : null;
      if (difOcActiva !== null && lineasFiltradas.length === activeResult.lineas.length && Math.abs(difOcActiva - difMlTotal) > 100) {
        const brecha = difOcActiva - difMlTotal;
        const filaConciliacion = document.createElement('tr');
        filaConciliacion.innerHTML = '<td colspan="12" style="text-align:right; font-size:0.82rem; color:var(--text-secondary); font-weight:700;">Dif ML de la OC, con impuesto interno y todos los productos:</td>' +
          '<td style="text-align:right; font-family:var(--font-mono); font-weight:800;">$' + difOcActiva.toLocaleString('es-CL') + '</td>' +
          '<td colspan="2" style="font-size:0.80rem; color:var(--text-muted);">Diferencia con las líneas: ' + (brecha > 0 ? '+' : '-') + '$' + Math.abs(brecha).toLocaleString('es-CL') + ' (impuesto interno y productos sin emparejar)</td>';
        tfoot.appendChild(filaConciliacion);
      }
    }
  }

  // --- MODAL DE CORROBORACIÓN Y DESGLOSE MATEMÁTICO SKU X SKU ---
  function abrirModalCalculoLinea(lineaIdx) {
    const res = wizardReconResult || reconActiveResult;
    if (!res || !res.lineas) return;
    const l = res.lineas[lineaIdx];
    if (!l) return;

    // Poblar ficha del producto
    const num = document.getElementById('calcNumLinea');
    const desc = document.getElementById('calcDescProducto');
    const sku = document.getElementById('calcSkuCodigo');
    const ean = document.getElementById('calcEan');
    const badge = document.getElementById('calcBadgeEstadoModal');

    if (num) num.textContent = l.linea;
    if (desc) desc.textContent = l.descripcion;
    if (sku) sku.textContent = `SKU: ${l.sku} / Cód: ${l.codigo}`;
    if (ean) ean.textContent = `EAN-13: ${l.ean}`;

    if (badge) {
      if (l.estado === 'CALCE_OK') {
        badge.className = 'badge badge-success';
        badge.style = '';
        badge.textContent = 'CALCE CONFORME 100%';
      } else if (l.estado === 'FALTANTE_RECEPCION') {
        badge.className = 'badge badge-warning';
        badge.style = 'background:rgba(245,158,11,0.15); color:var(--accent-amber); border:1px solid rgba(245,158,11,0.3);';
        badge.textContent = 'FALTANTE FÍSICO BODEGA';
      } else if (l.estado === 'DESCALCE_PRECIO') {
        badge.className = 'badge badge-danger';
        badge.style = '';
        badge.textContent = 'SOBREPRECIO FACTURADO';
      } else if (l.estado === 'DESCALCE_MIXTO') {
        badge.className = 'badge badge-danger';
        badge.style = 'background:#7f1d1d; color:#fecaca; border:1px solid #b91c1c;';
        badge.textContent = 'DOBLE DESCALCE (FALTANTE + PRECIO)';
      } else if (l.estado === 'REVISAR_UOM') {
        badge.className = 'badge badge-warning';
        badge.textContent = 'REVISAR UNIDAD DE MEDIDA';
      } else if (l.estado === 'NO_EN_OC') {
        badge.className = 'badge';
        badge.style = 'background:#581c87; color:#f3e8ff; border:1px solid #7e22ce;';
        badge.textContent = 'NO EN ORDEN DE COMPRA';
      } else if (l.estado === 'UOM_EMPAQUE') {
        badge.className = 'badge badge-info';
        badge.style = '';
        badge.textContent = `FACTOR UOM (x${l.factor_empaque || 24})`;
      }
    }

    // 1. Dimensión Física
    const cOrd = document.getElementById('calcCantOrdenada');
    const cFac = document.getElementById('calcCantFacturada');
    const cRec = document.getElementById('calcCantRecepcionada');
    const dQty = document.getElementById('calcDifFaltante');

    if (cOrd) cOrd.textContent = `${l.cantidad_ordenada !== undefined ? l.cantidad_ordenada : '-'} ${l.unidad_medida || 'UN'}`;
    if (cFac) cFac.textContent = `${l.cantidad_facturada} ${l.unidad_medida || 'UN'}`;
    if (cRec) cRec.textContent = `${l.cantidad_recepcionada} ${l.unidad_medida || 'UN'}`;
    if (dQty) {
      if (l.dif_cantidad < 0) {
        dQty.innerHTML = `<span class="diff-badge-neg">${l.dif_cantidad} unids (Faltante)</span>`;
      } else if (l.dif_cantidad > 0) {
        dQty.innerHTML = `<span class="diff-badge-pos">+${l.dif_cantidad} unids (Excedente)</span>`;
      } else {
        dQty.innerHTML = '<span class="diff-badge-zero">0 unids (Exacto)</span>';
      }
    }

    // 2. Dimensión Comercial
    const cCost = document.getElementById('calcCostoOc');
    const cPrc = document.getElementById('calcPrecioFac');
    const cUom = document.getElementById('calcUom');
    const dPrc = document.getElementById('calcDifPrecio');

    if (cCost) cCost.textContent = `$${Math.round(l.costo_oc).toLocaleString('es-CL')}`;
    if (cPrc) cPrc.textContent = `$${Math.round(l.precio_facturado).toLocaleString('es-CL')}`;
    if (cUom) cUom.textContent = l.is_uom_match ? `${l.unidad_medida} (x${l.factor_empaque} unids)` : (l.unidad_medida || 'UN');
    if (dPrc) {
      if (l.dif_precio > 0) {
        dPrc.innerHTML = `<span class="diff-badge-neg">+$${Math.round(l.dif_precio).toLocaleString('es-CL')} (Sobreprecio)</span>`;
      } else if (l.dif_precio < 0) {
        dPrc.innerHTML = `<span class="diff-badge-pos">-$${Math.round(Math.abs(l.dif_precio)).toLocaleString('es-CL')} (Descuento)</span>`;
      } else {
        dPrc.innerHTML = '<span class="diff-badge-zero">$0 (Exacto)</span>';
      }
    }

    // 3. Dimensión Financiera
    const tFac = document.getElementById('calcTotalFacturado');
    const tVal = document.getElementById('calcTotalValido');
    const tTip = document.getElementById('calcTipoReclamoTexto');
    const tNc = document.getElementById('calcMontoTotalNc');

    if (tFac) tFac.textContent = `$${Math.round(l.total_facturado).toLocaleString('es-CL')}`;
    if (tVal) tVal.textContent = `$${Math.round(l.total_esperado).toLocaleString('es-CL')}`;
    if (tTip) {
      if (l.estado === 'CALCE_OK' || l.estado === 'UOM_EMPAQUE') tTip.textContent = 'Sin Reclamo (Conforme)';
      else if (l.estado === 'FALTANTE_RECEPCION') tTip.textContent = 'Nota de Crédito x Faltante Físico';
      else if (l.estado === 'DESCALCE_PRECIO') tTip.textContent = 'Nota de Crédito x Sobreprecio';
      else if (l.estado === 'DESCALCE_MIXTO') tTip.textContent = 'NC Mixta (Faltante + Sobreprecio)';
      else if (l.estado === 'NO_EN_OC') tTip.textContent = 'Rechazo 100% de la Línea';
    }
    if (tNc) tNc.textContent = `$${Math.round(l.monto_reclamar).toLocaleString('es-CL')} CLP`;

    // 4. Demostración Matemática Paso a Paso
    const fBox = document.getElementById('calcFormulaExplicacion');
    if (fBox) {
      let formulaHtml = '';
      if (l.estado === 'CALCE_OK') {
        formulaHtml = `✅ CONCILIACIÓN FÍSICA Y COMERCIAL CONFORME (100%):
• Cantidad: ${l.cantidad_facturada} facturadas = ${l.cantidad_recepcionada} recepcionadas (Diferencia = 0 unids).
• Precio: $${Math.round(l.precio_facturado).toLocaleString('es-CL')} cobrado = $${Math.round(l.costo_oc).toLocaleString('es-CL')} pactado en OC (Diferencia = $0).
• Total a Pagar Conforme: ${l.cantidad_recepcionada} unids × $${Math.round(l.costo_oc).toLocaleString('es-CL')} = $${Math.round(l.total_esperado).toLocaleString('es-CL')} CLP.
• Monto a Reclamar: $0 CLP (Sin Nota de Crédito requerida).`;
      } else if (l.estado === 'UOM_EMPAQUE') {
        formulaHtml = `🔄 CALCE POR FACTOR DE EMPAQUE (UOM HOMOLOGADO):
• Facturado: ${l.cantidad_facturada} ${l.unidad_medida} @ $${Math.round(l.precio_facturado).toLocaleString('es-CL')}.
• Recepcionado en Bodega: ${l.cantidad_recepcionada} unidades individuales @ $${Math.round(l.costo_oc).toLocaleString('es-CL')}.
• Factor: 1 ${l.unidad_medida} = ${l.factor_empaque} unidades individuales.
• Validación: (${l.cantidad_facturada} cajas × ${l.factor_empaque}) = ${l.cantidad_recepcionada} unids.
• Total Facturado = Total Recepcionado = $${Math.round(l.total_facturado).toLocaleString('es-CL')} CLP. Conforme para pago.`;
      } else if (l.estado === 'NO_EN_OC') {
        formulaHtml = `🚫 ÍTEM FACTURADO NO EXISTE EN LA ORDEN DE COMPRA:
• Código cobrado: ${l.codigo} - "${l.descripcion}".
• Este producto no tiene autorización de compra ni orden asociada en SAP MM para PedidosYa / Dmarts Chile.
• Total Cobrado Improcedente: ${l.cantidad_facturada} unids × $${Math.round(l.precio_facturado).toLocaleString('es-CL')} = $${Math.round(l.total_facturado).toLocaleString('es-CL')} CLP.
• TOTAL A RECLAMAR (100% DE LA LÍNEA): $${Math.round(l.monto_reclamar).toLocaleString('es-CL')} CLP en Nota de Crédito.`;
      } else {
        const lineasFormula = [];
        lineasFormula.push(`📐 DEMOSTRACIÓN / CORROBORACIÓN DIF ML (MONEDA LOCAL):`);
        lineasFormula.push(`1. Total Facturado por Proveedor (ML): ${l.cantidad_facturada} unids × $${Math.round(l.precio_facturado).toLocaleString('es-CL')} = $${Math.round(l.total_facturado).toLocaleString('es-CL')} CLP.`);
        lineasFormula.push(`2. Total Válido Recepcionado (ML): ${l.cantidad_recepcionada} unids × $${Math.round(l.costo_oc).toLocaleString('es-CL')} = $${Math.round(l.total_esperado).toLocaleString('es-CL')} CLP.`);
        const difMlLinea = Math.round(l.total_facturado - l.total_esperado);
        lineasFormula.push(`3. Diferencia en Moneda Local (Dif ML): Facturado ($${Math.round(l.total_facturado).toLocaleString('es-CL')}) - Recepcionado ($${Math.round(l.total_esperado).toLocaleString('es-CL')}) = $${difMlLinea.toLocaleString('es-CL')} CLP.`);
        lineasFormula.push(`----------------------------------------------------------------`);
        lineasFormula.push(`DESGLOSE DE LA NOTA DE CRÉDITO RECLAMABLE:`);
        if (l.dif_cantidad < 0) {
          const cFalt = Math.abs(l.dif_cantidad);
          const mFalt = cFalt * l.precio_facturado;
          lineasFormula.push(` • Faltante Físico Bodega: ${cFalt} unids no recibidas × $${Math.round(l.precio_facturado).toLocaleString('es-CL')} (Precio Cobrado) = $${Math.round(mFalt).toLocaleString('es-CL')} CLP`);
        }
        if (l.dif_precio > 0) {
          const mSobre = l.cantidad_recepcionada * l.dif_precio;
          lineasFormula.push(` • Sobreprecio Unitario: ${l.cantidad_recepcionada} unids rec. × $${Math.round(l.dif_precio).toLocaleString('es-CL')} (Δ Precio) = $${Math.round(mSobre).toLocaleString('es-CL')} CLP`);
        }
        lineasFormula.push(`----------------------------------------------------------------`);
        lineasFormula.push(`👉 TOTAL DIF ML / NOTA DE CRÉDITO A RECLAMAR: $${Math.round(l.monto_reclamar).toLocaleString('es-CL')} CLP`);
        formulaHtml = lineasFormula.join('\n');
      }
      fBox.textContent = formulaHtml;
    }

    // 5. Diagnóstico & Acción
    const dDiag = document.getElementById('calcDiagnosticoTexto');
    const dAcc = document.getElementById('calcAccionTexto');
    if (dDiag) dDiag.textContent = l.diagnostico;
    if (dAcc) dAcc.textContent = l.accion;

    // Mostrar modal
    const modal = document.getElementById('modalDetalleCalculoLinea');
    if (modal) modal.classList.add('active');
  }

  function recalcularJevModal() {
    const res = reconActiveResult || wizardReconResult;
    if (!res) return;

    const chkIva = document.getElementById('chkJevIncluirIva');
    const chkAforo = document.getElementById('chkJevAplicarAforo');
    const includeTax = chkIva ? chkIva.checked : true;
    const aplicarAforo = chkAforo ? chkAforo.checked : true;
    const costCenter = document.getElementById('lblJevCostCenter')?.textContent || 'CD_36_CD_Chile';
    const companyCode = localStorage.getItem('cfg_sap_co') || '6202';

    const facturadoNeto = Math.round(Number(res.total_facturado_neto || 0));
    const recepcionadoNeto = Math.round(Number(res.total_recepcionado_neto || 0));
    const descalcePrecio = Math.round(Number(res.total_descalce_precio || 0));
    const faltanteRecepcion = Math.round(Number(res.total_faltante_recepcion || 0));
    const noEnOc = Math.round(Number(res.total_no_en_oc || 0));
    const montoReclamarTotal = Math.round(Number(res.total_monto_a_reclamar || res.total_monto_reclamar || 0));

    let montoRetencionAforo = 0;
    if (aplicarAforo) {
      const rawAforo = (res.aforo_info && (res.aforo_info.monto_retenido_aforo || res.aforo_info.monto_aforo || res.aforo_info.monto_aforado))
        || res.monto_retenido_aforo
        || res.monto_aforo
        || res.monto_aforado
        || (res.sap_3wm && res.sap_3wm.monto_aforo)
        || 0;
      montoRetencionAforo = Math.round(Number(rawAforo));
    }

    const lines = [];
    let itemCounter = 1;

    // 1. Débito a Compensación EM/RF (GR/IR)
    if (recepcionadoNeto > 0) {
      lines.push({
        item: itemCounter++,
        dc: 'D',
        account: '11070000',
        account_name: 'Compensación EM/RF Mercadería Bodega',
        debit: recepcionadoNeto,
        credit: 0,
        cost_center: costCenter,
        assignment: `PO:${res.po_number || '-'}`,
        text: `Recepción Mercadería Conforme Folio ${res.folio_factura}`
      });
    }

    // 2. Débito a PPV (Desviación en Precio de Compra)
    if (descalcePrecio > 0) {
      lines.push({
        item: itemCounter++,
        dc: 'D',
        account: '51020100',
        account_name: 'Desviación en Precio de Compra (PPV)',
        debit: descalcePrecio,
        credit: 0,
        cost_center: costCenter,
        assignment: `PO:${res.po_number || '-'}`,
        text: `Sobreprecio Factura vs OC ${res.po_number || ''}`
      });
    }

    // 3. Débito a Reclamo Faltante Físico de Recepción
    if (faltanteRecepcion > 0) {
      lines.push({
        item: itemCounter++,
        dc: 'D',
        account: '11090200',
        account_name: 'Reclamo Pendiente NC - Faltante Bodega',
        debit: faltanteRecepcion,
        credit: 0,
        cost_center: costCenter,
        assignment: `FOL:${res.folio_factura}`,
        text: `Reclamo NC Faltante Físico Bodega`
      });
    }

    // 4. Débito a Reclamo Ítems No Ordenados en OC
    if (noEnOc > 0) {
      lines.push({
        item: itemCounter++,
        dc: 'D',
        account: '11090300',
        account_name: 'Reclamo Pendiente NC - SKU No en OC',
        debit: noEnOc,
        credit: 0,
        cost_center: costCenter,
        assignment: `FOL:${res.folio_factura}`,
        text: `Reclamo NC Ítems no contemplados en OC`
      });
    }

    // Remanente general si aplica
    const sumaDesgloses = descalcePrecio + faltanteRecepcion + noEnOc;
    const remanente = montoReclamarTotal - sumaDesgloses;
    if (remanente > 0) {
      lines.push({
        item: itemCounter++,
        dc: 'D',
        account: '11090200',
        account_name: 'Reclamo Pendiente NC - Faltante Bodega',
        debit: remanente,
        credit: 0,
        cost_center: costCenter,
        assignment: `FOL:${res.folio_factura}`,
        text: `Ajuste Diferencia Reclamo NC`
      });
    }

    // 5. Débito por IVA Crédito Fiscal (19%)
    let montoIva = 0;
    if (includeTax) {
      montoIva = Math.round(facturadoNeto * 0.19);
      lines.push({
        item: itemCounter++,
        dc: 'D',
        account: '11080101',
        account_name: 'IVA Crédito Fiscal Operacional (19%)',
        debit: montoIva,
        credit: 0,
        cost_center: '',
        assignment: `DTE:${res.folio_factura}`,
        text: `IVA Crédito Fiscal (19%) DTE Folio ${res.folio_factura}`
      });
    }

    // 6. Proveedores Nacionales (Crédito / Haber)
    const totalBruto = includeTax ? (facturadoNeto + montoIva) : facturadoNeto;
    if (montoRetencionAforo > 0) {
      const saldoLiquido = Math.max(0, totalBruto - montoRetencionAforo);
      lines.push({
        item: itemCounter++,
        dc: 'C',
        account: '21040000',
        account_name: 'Proveedores Nacionales Comerciales',
        debit: 0,
        credit: saldoLiquido,
        cost_center: '',
        assignment: `RUT:${res.proveedor_rut || ''}`,
        text: `Factura ${res.folio_factura} Liq. Pago - ${res.proveedor_nombre || ''}`
      });
      lines.push({
        item: itemCounter++,
        dc: 'C',
        account: '21090100',
        account_name: 'Retenciones por Aforo Comercial Proveedor',
        debit: 0,
        credit: montoRetencionAforo,
        cost_center: costCenter,
        assignment: `AFORO:${res.proveedor_rut || ''}`,
        text: `Retención Preventiva Aforo Comercial 6202`
      });
    } else {
      lines.push({
        item: itemCounter++,
        dc: 'C',
        account: '21040000',
        account_name: 'Proveedores Nacionales Comerciales',
        debit: 0,
        credit: totalBruto,
        cost_center: '',
        assignment: `RUT:${res.proveedor_rut || ''}`,
        text: `Factura ${res.folio_factura} - ${res.proveedor_nombre || 'Proveedor'}`
      });
    }

    // Cuadratura
    let totDebe = 0;
    let totHaber = 0;
    lines.forEach(l => {
      totDebe += l.debit;
      totHaber += l.credit;
    });

    const dif = Math.abs(totDebe - totHaber);
    if (dif <= 2 && dif !== 0 && lines.length > 0) {
      lines[0].debit += (totHaber - totDebe);
      totDebe = totHaber;
    }

    const isBalanced = (Math.abs(totDebe - totHaber) === 0);

    const voucherId = `JEV-${companyCode}-${new Date().toISOString().slice(0, 10).replace(/-/g, '')}-${res.folio_factura || '00'}`;
    currentJevData = {
      voucher_id: voucherId,
      company_code: companyCode,
      lines: lines,
      totDebe: totDebe,
      totHaber: totHaber,
      isBalanced: isBalanced,
      folio: res.folio_factura,
      proveedor: res.proveedor_nombre,
      po: res.po_number
    };

    // Actualizar UI Modal JEV
    const badgeId = document.getElementById('jevVoucherIdBadge');
    if (badgeId) badgeId.textContent = voucherId;

    const badgeBal = document.getElementById('jevBalancedBadge');
    if (badgeBal) {

      `Voucher ID: ${currentJevData.voucher_id} | Factura: ${currentJevData.folio} | PO: ${currentJevData.po}`,

    const res = reconActiveResult || wizardReconResult;
    if (!res || !res.lineas) {
      if (!isAuto) alert('Primero debes ejecutar la conciliación de una factura para aplicar el análisis TypeSafe AI Jev.');
      return;
    }

    const badge = document.getElementById('badgeJevAiStatus');
    const btn = document.getElementById('btnJevAiAuditPaso3');
    const origHtml = btn ? btn.innerHTML : '';
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:14px; height:14px;"></span> Jev AI analizando...';
    }
    if (badge) {
      badge.innerHTML = '<span class="spinner" style="width:10px; height:10px; border-width:2px;"></span> AI analizando...';
      badge.style.background = 'rgba(124,58,237,0.18)';
    }

    if (!isAuto) {
      showToast('⚡ Ejecutando triage y clasificación inteligente con TypeSafe AI Jev...', 'info');
    }

    google.script.run
      .withSuccessHandler((resp) => {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = 'Jev AI activo';
          btn.style.background = 'rgba(124,58,237,0.15)';
        }
        if (badge) {
          badge.innerHTML = 'AI Triage listo';
          badge.style.background = 'rgba(16,185,129,0.12)';
          badge.style.color = 'var(--accent-green)';
          badge.style.borderColor = 'rgba(16,185,129,0.3)';
        }

        if (resp && resp.success && resp.data && resp.data.lineas) {
          resp.data.lineas.forEach((enriched, idx) => {
            if (res.lineas[idx]) {
              res.lineas[idx].jev_root_cause = enriched.jev_root_cause;
              res.lineas[idx].jev_severity = enriched.jev_severity;
              res.lineas[idx].jev_confidence = enriched.jev_confidence;
              res.lineas[idx].jev_recommended_action = enriched.jev_recommended_action;
              res.lineas[idx].jev_gl_account = enriched.jev_gl_account;
              res.lineas[idx].jev_reasoning = enriched.jev_reasoning;
            }
          });

          filtrarTablaPaso3();
          if (!isAuto) {
            showToast(`¡Listo! TypeSafe AI Jev analizó ${resp.data.total_lineas} ítems (${resp.data.total_discrepancias} discrepancias clasificadas).`, 'success');

          btn.innerHTML = origHtml;

          badge.innerHTML = 'AI Triage local';
        }
        if (!isAuto) {
          showToast('Error en TypeSafe AI Jev: ' + err.message, 'danger');
        }
      })
      .apiEjecutarJevTypeSafeAudit(res);
  }

function initAgentsDashboardModal() {
  var btnOpen = document.getElementById('btnOpenAgentsDashboard');
  var btnClose = document.getElementById('btnCloseAgentsDashboard');
  var btnCloseBottom = document.getElementById('btnCloseAgentsDashboardBottom');
  var btnRefresh = document.getElementById('btnRefreshAgentsStatus');
  var btnToggleTrigger = document.getElementById('btnToggleHourlyTrigger');
  var btnRunNow = document.getElementById('btnRunAgentsCycleNow');
  var filterInput = document.getElementById('txtBuscarJevTabla');

  if (btnOpen) btnOpen.addEventListener('click', function() {
    document.getElementById('modalAgentsDashboard').classList.add('active');
    loadAgentsStatus();
  });

  var closeModal = function() {
    document.getElementById('modalAgentsDashboard').classList.remove('active');
  };
  if (btnClose) btnClose.addEventListener('click', closeModal);
  if (btnCloseBottom) btnCloseBottom.addEventListener('click', closeModal);

  if (btnRefresh) btnRefresh.addEventListener('click', loadAgentsStatus);

  if (btnToggleTrigger) btnToggleTrigger.addEventListener('click', function() {
    var btn = btnToggleTrigger;
    btn.disabled = true;
    btn.textContent = '⏳ Procesando...';
    var isActive = btn.dataset.active === 'true';
    if (isActive) {
      google.script.run
        .withSuccessHandler(function(r) {
          btn.disabled = false;
          showToast('Trigger desactivado.', 'success');
          loadAgentsStatus();
        })
        .withFailureHandler(function(e) {
          btn.disabled = false;
          showToast('Error: ' + e.message, 'error');
        })
        .apiUninstallAutonomousTriggers();
    } else {
      google.script.run
        .withSuccessHandler(function(r) {
          btn.disabled = false;
          showToast('⏰ Trigger horario activado!', 'success');
          loadAgentsStatus();
        })
        .withFailureHandler(function(e) {
          btn.disabled = false;
          showToast('Error: ' + e.message, 'error');
        })
        .apiInstallAutonomousTriggers();
    }
  });

  if (btnRunNow) btnRunNow.addEventListener('click', function() {
    btnRunNow.disabled = true;
    btnRunNow.textContent = '⏳ Ejecutando ciclo...';
    google.script.run
      .withSuccessHandler(function(r) {
        btnRunNow.disabled = false;
        btnRunNow.textContent = '⚡ Ejecutar Ciclo Ahora';
        showToast('✅ Ciclo completado!', 'success');
        loadAgentsStatus();
      })
      .withFailureHandler(function(e) {
        btnRunNow.disabled = false;
        btnRunNow.textContent = '⚡ Ejecutar Ciclo Ahora';
        showToast('Error: ' + e.message, 'error');
      })
      .apiRunAutonomousAgentsCycle();
  });

  if (filterInput) filterInput.addEventListener('input', function() {
    renderJevTable(filterInput.value);
  });

  // Consultar y conciliar PO específica con el Agente Autónomo
  var btnReconcilePo = document.getElementById('btnAgentReconcilePo');
  var txtTargetPo = document.getElementById('txtAgentTargetPo');
  if (btnReconcilePo && txtTargetPo) {
    btnReconcilePo.addEventListener('click', function() {
      ejecutarConciliacionAgenteBajoDemanda(txtTargetPo.value);
    });
    txtTargetPo.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        ejecutarConciliacionAgenteBajoDemanda(txtTargetPo.value);
      }
    });
  }

  // Botón delegar conciliación al Agente desde Paso 1
  var btnDelegarAgentePaso1 = document.getElementById('btnDelegarAgentePaso1');
  if (btnDelegarAgentePaso1) {
    btnDelegarAgentePaso1.addEventListener('click', function() {
      var poVal = '';
      var lblTitulo = document.getElementById('lblPoVinculoTitulo');
      if (lblTitulo && lblTitulo.textContent) {
        var match = lblTitulo.textContent.match(/PO\s*(\d+)/i);
        if (match) poVal = 'PO' + match[1];
      }
      if (!poVal) {
        var txtBusq = document.getElementById('txtBuscarFactura');
        if (txtBusq && txtBusq.value) {
          var match2 = txtBusq.value.match(/(\d{6})/);
          if (match2) poVal = 'PO' + match2[1];
          else poVal = txtBusq.value.trim();
        }
      }
      var modal = document.getElementById('modalAgentsDashboard');
      if (modal) modal.style.display = 'flex';
      loadAgentsStatus();
      if (txtTargetPo && poVal) {
        txtTargetPo.value = poVal;
        ejecutarConciliacionAgenteBajoDemanda(poVal);
      }
    });
  }
}

var _allArchivedJevs = [];

function loadAgentsStatus() {
  var lblStatus = document.getElementById('lblAutomationStatusText');
  if (lblStatus) lblStatus.textContent = 'Consultando...';
  if (typeof google === 'undefined' || !google.script) return;
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.success) return;
      var s = r.status;
      var el = function(id) { return document.getElementById(id); };
      if (el('kpiAgentIngestedCount')) el('kpiAgentIngestedCount').textContent = s.processedHistoryCount || 0;
      if (el('kpiAgentPendingMatchCount')) el('kpiAgentPendingMatchCount').textContent = s.pendingMatchingCount || 0;
      if (el('kpiAgentJevBalancedCount')) el('kpiAgentJevBalancedCount').textContent = s.archivedJevsCount || 0;
      if (s.archivedJevs) {
        var totalClaim = s.archivedJevs.reduce(function(acc, j) { return acc + (j.claim_amount || 0); }, 0);
        if (el('kpiAgentClaimsTotal')) el('kpiAgentClaimsTotal').textContent = '$' + totalClaim.toLocaleString('es-CL');
        if (el('badgeNavJevCount')) el('badgeNavJevCount').textContent = s.archivedJevsCount || 0;
        _allArchivedJevs = s.archivedJevs;
        renderJevTable('');
      }
      var triggerBtn = document.getElementById('btnToggleHourlyTrigger');
      var badge = document.getElementById('badgeTriggerStatus');
      if (s.isTriggerActive) {
        if (lblStatus) lblStatus.textContent = '✅ Activo — Ejecutándose cada 1 hora automáticamente';
        if (triggerBtn) { triggerBtn.textContent = '⏹ Desactivar Trigger'; triggerBtn.dataset.active = 'true'; }
        if (badge) { badge.textContent = '⏰ TRIGGER: ACTIVO (1H)'; badge.className = 'badge badge-success font-mono'; }
      } else {
        if (lblStatus) lblStatus.textContent = '⏸ Inactivo — Ejecutar manualmente o activar trigger';
        if (triggerBtn) { triggerBtn.textContent = '⏰ Activar Trigger (Cada 1h)'; triggerBtn.dataset.active = 'false'; }
        if (badge) { badge.textContent = '⏸ TRIGGER: INACTIVO'; badge.className = 'badge badge-warning font-mono'; }
      }
    })
    .withFailureHandler(function(e) { console.error('Error cargando agentes status:', e); })
    .apiGetAutonomousAgentsStatus();
}

function renderJevTable(filter) {
  var tbody = document.getElementById('tbodyJevArchivados');
  if (!tbody) return;
  var q = (filter || '').toLowerCase();
  var data = q
    ? _allArchivedJevs.filter(function(j) {
        return (j.supplier || '').toLowerCase().includes(q) ||
               String(j.folio).includes(q) ||
               (j.po || '').toLowerCase().includes(q) ||
               (j.voucher_id || '').toLowerCase().includes(q);
      })
    : _allArchivedJevs;

  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:20px; color:var(--text-muted);">No hay pólizas archivadas aún. Ejecuta un ciclo para generar asientos SAP JEV.</td></tr>';
    return;
  }

  tbody.innerHTML = data.slice().reverse().map(function(j) {
    return '<tr>' +
      '<td class="font-mono" style="font-size:0.78rem; color:var(--accent-blue); white-space:nowrap;">' + (j.voucher_id || '-') + '</td>' +
      '<td style="text-align:center; font-weight:700;">' + (j.folio || '-') + '</td>' +
      '<td style="text-align:center; font-size:0.8rem; color:var(--text-secondary);">' + (j.po || '-') + '</td>' +
      '<td style="font-size:0.8rem; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="' + (j.supplier || '') + '">' + (j.supplier || '-') + '</td>' +
      '<td class="font-mono" style="text-align:right; font-weight:700;">$' + ((j.total_bruto || 0).toLocaleString('es-CL')) + '</td>' +
      '<td class="font-mono" style="text-align:right; font-weight:700; color:var(--accent-red);">' +
        (j.has_claim ? '$' + (j.claim_amount || 0).toLocaleString('es-CL') : '<span style="color:var(--accent-green)">Sin reclamo</span>') +
      '</td>' +
      '<td style="text-align:center;"><span class="badge badge-success" style="font-size:0.7rem;">✅ CUADRADO</span></td>' +
      '<td style="text-align:center;">' +
        '<button class="btn btn-secondary btn-sm" style="font-size:0.75rem; padding:3px 8px;" onclick="descargarJevCsvDesdeAgente(\'' + j.folio + '\',\'' + j.po + '\',\'' + (j.voucher_id || '') + '\')">' +
          '⬇️ CSV SAP' +
        '</button>' +
      '</td>' +
    '</tr>';
  }).join('');
}

function descargarJevCsvDesdeAgente(folio, po, voucherId) {

          '<div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:12px;">' +
            '<div>' +
              '<div style="font-size:0.75rem; color:#93c5fd; text-transform:uppercase; font-weight:700; letter-spacing:0.04em;">Veredicto de Conciliación Autónoma</div>' +

              '<div style="font-size:0.82rem; color:var(--text-secondary); margin-top:3px;">' +
                '🏢 <strong>' + r.supplier_name + '</strong> (' + r.supplier_rut + ') &bull; OC: <strong class="font-mono" style="color:var(--accent-cyan);">' + r.po + '</strong>' +
              '</div>' +
            '</div>' +
            '<div style="text-align:right;">' +
              '<div style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase;">Diferencia en Moneda Local (Dif ML):</div>' +

            '</div>' +
          '</div>' +

          '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px; margin:12px 0; background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.06); border-radius:6px; padding:10px 14px;">' +
            '<div>' +
              '<div style="font-size:0.7rem; color:var(--text-muted);">TOTAL FACTURADO (DTE):</div>' +
              '<div class="font-mono" style="font-weight:700; font-size:0.95rem; color:var(--accent-cyan);">$' + (r.total_facturado_neto || 0).toLocaleString('es-CL') + '</div>' +
              '<div style="font-size:0.68rem; color:var(--text-muted);">' + (r.invoices_count || 0) + ' Factura(s) DTE</div>' +
            '</div>' +
            '<div>' +
              '<div style="font-size:0.7rem; color:var(--text-muted);">RECEPCIONADO BODEGA:</div>' +
              '<div class="font-mono" style="font-weight:700; font-size:0.95rem; color:var(--accent-green);">$' + (r.total_recepcionado_neto || 0).toLocaleString('es-CL') + '</div>' +
              '<div style="font-size:0.68rem; color:var(--text-muted);">Según BigQuery cl_dmarts</div>' +
            '</div>' +
            '<div>' +
              '<div style="font-size:0.7rem; color:var(--text-muted);">FALTANTE FÍSICO:</div>' +
              '<div class="font-mono" style="font-weight:700; font-size:0.95rem; color:var(--accent-amber);">$' + (r.desglose ? r.desglose.faltante_fisico : 0).toLocaleString('es-CL') + '</div>' +
            '</div>' +
            '<div>' +
              '<div style="font-size:0.7rem; color:var(--text-muted);">SOBREPRECIO (Δ PRECIO):</div>' +
              '<div class="font-mono" style="font-weight:700; font-size:0.95rem; color:var(--accent-red);">$' + (r.desglose ? r.desglose.descalce_precio : 0).toLocaleString('es-CL') + '</div>' +
            '</div>' +
            '<div>' +
              '<div style="font-size:0.7rem; color:var(--text-muted);">ÍTEMS AUDITADOS:</div>' +
              '<div class="font-mono" style="font-weight:700; font-size:0.95rem;">' + (r.lineas_count || 0) + ' SKUs</div>' +
              '<div style="font-size:0.68rem; color:var(--accent-red);">' + (r.lineas_con_descalce || 0) + ' con descalce</div>' +
            '</div>' +
          '</div>' +

          '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-top:14px; border-top:1px dashed rgba(255,255,255,0.1); padding-top:12px;">' +
            '<div style="font-size:0.78rem; color:var(--text-secondary);">' +
              '💡 El asiento contable ya quedó guardado en el archivo del Agente 3.' +
            '</div>' +
            '<div style="display:flex; gap:8px; flex-wrap:wrap;">' +
              '<button type="button" class="btn btn-secondary btn-sm" onclick="descargarJevCsvDirectoDesdeAgente()">' +
                '⬇️ Descargar CSV SAP 6202' +
              '</button>' +
              '<button type="button" class="btn btn-success btn-sm" onclick="generarPlanillaDesdeAgente()">' +
                '📊 Planilla Finanzas (Sheets)' +
              '</button>' +
              '<button type="button" class="btn btn-primary btn-sm" onclick="abrirResultadoAgenteEnPaso3()">' +
                '👁️ Ver diferencias SKU x SKU ➔' +
              '</button>' +
            '</div>' +
          '</div>' +
        '</div>';

      showToast('✅ PO ' + r.po + ' conciliada con éxito por el Agente', 'success');
    })
    .withFailureHandler(function(e) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<span>🤖</span> Conciliar con Agente';
      }
      if (divRes) {
        divRes.innerHTML =
          '<div style="background:rgba(220,38,38,0.1); border:1px solid rgba(220,38,38,0.3); border-radius:var(--radius-sm); padding:14px; color:var(--accent-red); font-size:0.85rem;">' +
            '❌ <strong>Error en el proceso:</strong> ' + e.message +
          '</div>';
      }
      showToast('Error: ' + e.message, 'error');
    })
    .apiAgentReconcileSpecificPo(po);
}

function descargarJevCsvDirectoDesdeAgente() {
  if (!_lastAgentReconcileResult || !_lastAgentReconcileResult.sap_csv) {
    showToast('No hay póliza CSV generada para esta consulta.', 'warning');
    return;
  }
  var r = _lastAgentReconcileResult;
  var filename = 'JEV_SAP_6202_' + r.po + '.csv';
  descargarTextoComoArchivo(filename, r.sap_csv, 'text/csv;charset=utf-8;');
  showToast('✅ CSV SAP descargado: ' + filename, 'success');
}

function generarPlanillaDesdeAgente() {
  if (!_lastAgentReconcileResult || !_lastAgentReconcileResult.reconciliation_data) {
    showToast('No hay datos para generar la planilla.', 'warning');
    return;
  }
  abrirResultadoAgenteEnPaso3();
  setTimeout(function() {
    var btn = document.getElementById('btnBannerGenerarPlanilla');
    if (btn) btn.click();
  }, 400);
}

function abrirResultadoAgenteEnPaso3() {
  if (!_lastAgentReconcileResult || !_lastAgentReconcileResult.reconciliation_data) {
    showToast('No hay datos de conciliación disponibles.', 'warning');
    return;
  }
  var rec = _lastAgentReconcileResult.reconciliation_data;
  var modal = document.getElementById('modalAgentsDashboard');
  if (modal) modal.style.display = 'none';

  renderizarPaso3Completo(rec);
  irAPasoWizard(3);
}

// Exposición explícita en window para compatibilidad global
window.irAPasoWizard = irAPasoWizard;
window.cambiarOpcionDescalceAnalista = cambiarOpcionDescalceAnalista;
window.generarYDescargarExcelClientSide = generarYDescargarExcelClientSide;
window.abrirModalCalculoLinea = abrirModalCalculoLinea;
window.cerrarModalCalculoLinea = cerrarModalCalculoLinea;
window.copiarFormulaLineaModal = copiarFormulaLineaModal;
window.mostrarDetalleCalculoModal = abrirModalCalculoLinea;
window.descargarJevCsvDirectoDesdeAgente = descargarJevCsvDirectoDesdeAgente;
window.generarPlanillaDesdeAgente = generarPlanillaDesdeAgente;
window.abrirResultadoAgenteEnPaso3 = abrirResultadoAgenteEnPaso3;

</script>
