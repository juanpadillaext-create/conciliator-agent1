    const supTax = (reg ? reg.supplier_tax_id : (data.supplier_tax_id || '-'));
    const whName = (reg ? reg.warehouse_name : (data.warehouse_name || 'CH_36_CD_Chile'));
    const aforoCond = (reg ? reg.condicion_aforo : (data.condicion_aforo || 'NO AFORADO POR SOLICITUD DE COMERCIAL'));

    const totOrd = reg ? safeNum(reg.total_ordenado_neto) : safeNum(data.total_oc_ordenado);
    const totRec = reg ? safeNum(reg.total_recepcionado_neto) : safeNum(data.total_oc_recepcionado);

    // Sumar de manera segura el total facturado neto deduciendo Notas de Crédito (DTE 61 / NC)
    let totFacNeto = 0;
    let totFacturasNeto = 0;
    let totNcsNeto = 0;
    let countNcs = 0;
    let countFacs = 0;
    let totImpuestoFacturas = 0;
    let totImpuestoNcs = 0;

    if (data.invoices && Array.isArray(data.invoices) && data.invoices.length > 0) {
      data.invoices.forEach(inv => {
        const val = safeNum(inv.monto_neto);
        const isNc = Boolean(inv.es_nc || inv.is_nc || inv.tipo_dte === 'CL61' || inv.tipo_dte === 'NC' || String(inv.tipo_documento || '').includes('Crédito'));
        if (documentoSinEfecto(inv, isNc)) return;
        if (isNc) totImpuestoNcs += safeNum(inv.impuesto_interno); else totImpuestoFacturas += safeNum(inv.impuesto_interno);
        if (isNc) {
          totNcsNeto += val;
          countNcs++;
        } else {
          totFacturasNeto += val;
          countFacs++;
        }
      });
      totFacNeto = totFacturasNeto - totNcsNeto;
    } else if (reg && reg.total_facturado_neto !== undefined) {
      totFacNeto = safeNum(reg.total_facturado_neto);
      totNcsNeto = safeNum(reg.total_ncs_neto || 0);
    } else {
      totFacNeto = safeNum(data.total_facturado_neto);
      totNcsNeto = safeNum(data.total_ncs_neto || 0);
    }

    let totFacIva = 0;
    if (data.invoices && Array.isArray(data.invoices) && data.invoices.length > 0) {
      let totFactIva = 0;
      let totNcIva = 0;
      data.invoices.forEach(inv => {
        const val = (safeNum(inv.monto_total) || Math.round(safeNum(inv.monto_neto) * 1.19));
        const isNc = Boolean(inv.es_nc || inv.is_nc || inv.tipo_dte === 'CL61' || inv.tipo_dte === 'NC' || String(inv.tipo_documento || '').includes('Crédito'));
        if (documentoSinEfecto(inv, isNc)) return;
        if (isNc) {
          totNcIva += val;
        } else {
          totFactIva += val;
        }
      });
      totFacIva = totFactIva - totNcIva;
    } else if (reg && reg.total_facturado_con_iva !== undefined) {
      totFacIva = safeNum(reg.total_facturado_con_iva);
    } else {
      totFacIva = safeNum(data.total_facturado_total) || Math.round(totFacNeto * 1.19);
    }

    // El recepcionado incluye impuesto interno: el facturado se compara en la misma base
    const hayDocsPo = Boolean(data.invoices && Array.isArray(data.invoices) && data.invoices.length > 0);
    const totFacBase = totFacNeto + (hayDocsPo ? (totImpuestoFacturas - totImpuestoNcs) : safeNum(data.total_impuesto_interno_neto));
    const totNcsBase = totNcsNeto + (hayDocsPo ? totImpuestoNcs : 0);

    const countInvs = (data.invoices && Array.isArray(data.invoices) && data.invoices.length > 0)
      ? data.invoices.length
      : ((reg && reg.total_facturas !== undefined) ? reg.total_facturas : (data.total_invoices || (data.invoices ? data.invoices.length : 0)));

    // REGLA 2: Para el cálculo de la diferencia en moneda local, el monto de referencia de la Orden de Compra debe corresponder a la suma de los montos netos de las facturas menos Notas de Crédito
    // REGLA 2: Para el cálculo de la diferencia en moneda local, el monto de referencia de la Orden de Compra debe corresponder al total ordenado real o facturado neto
    const montoRefOc = (reg && reg.dif_ml !== undefined && reg.total_ordenado_neto && !data.invoices?.length)
      ? safeNum(reg.total_ordenado_neto)
      : (reg && reg.dif_ml !== undefined && reg.total_ordenado_neto)
        ? safeNum(reg.total_ordenado_neto)
        : (totFacNeto > 0 ? totFacBase : (reg ? safeNum(reg.total_ordenado_neto) : safeNum(data.total_oc_ordenado)));

    // REGLA 3: La diferencia en moneda local refleja la discrepancia real entre el monto de referencia y el recepcionado
    const dif = (reg && reg.dif_ml !== undefined) ? safeNum(reg.dif_ml) : Math.round(montoRefOc - totRec);

    if (lblTitulo) lblTitulo.textContent = `Orden de Compra: ${poNom}`;
    if (lblBadge) {
      lblBadge.textContent = countNcs > 0
        ? `${countInvs} Documentos (${countFacs} Facturas + ${countNcs} NCs)`
        : `${countInvs} Facturas Asociadas`;
    }
    if (lblSub) lblSub.innerHTML = `Proveedor: <strong>${supName}</strong> (${supTax}) &bull; Almacén: <strong>${whName}</strong> &bull; Aforo: <span class="badge badge-info" style="font-size:0.75rem;">${aforoCond}</span>`;

    if (lblTotOrd) lblTotOrd.textContent = `$${Math.round(montoRefOc).toLocaleString('es-CL')}`;
    if (lblTotRec) lblTotRec.textContent = `$${Math.round(totRec).toLocaleString('es-CL')}`;
    if (lblCntFac) lblCntFac.textContent = `${countInvs}`;
    if (lblTotFac) lblTotFac.textContent = `$${Math.round(totFacNeto).toLocaleString('es-CL')} Neto`;
    if (lblTotFacIva) lblTotFacIva.textContent = `Total con IVA: $${Math.round(totFacIva).toLocaleString('es-CL')}`;

    if (lblDif) {
      if (dif > 0) {
        lblDif.textContent = `+$${Math.round(dif).toLocaleString('es-CL')}`;
        lblDif.style.color = 'var(--accent-red)';
        if (lblDifSub) {
          lblDifSub.textContent = (reg && reg.dif_ml !== undefined)
            ? `Costo Real OC ($${Math.round(montoRefOc).toLocaleString('es-CL')}) - Recepcionado ($${Math.round(totRec).toLocaleString('es-CL')}) = Dif Real: +$${Math.round(dif).toLocaleString('es-CL')} CLP`
            : `Facturado neteado con imp. interno ($${Math.round(totFacBase).toLocaleString('es-CL')}) - Recepcionado ($${Math.round(totRec).toLocaleString('es-CL')}) = Dif ML: +$${Math.round(dif).toLocaleString('es-CL')} CLP`;
        }
      } else if (dif < 0) {
        lblDif.textContent = `-$${Math.round(Math.abs(dif)).toLocaleString('es-CL')}`;
        lblDif.style.color = 'var(--accent-blue)';
        if (lblDifSub) lblDifSub.textContent = `Facturado neteado con imp. interno ($${Math.round(totFacBase).toLocaleString('es-CL')}) - Recepcionado ($${Math.round(totRec).toLocaleString('es-CL')}) = Dif ML: -$${Math.round(Math.abs(dif)).toLocaleString('es-CL')} CLP`;
      } else {
        lblDif.textContent = `$0`;
        lblDif.style.color = 'var(--accent-green)';
        if (lblDifSub) lblDifSub.textContent = `🟢 Conciliación Conforme 100% (Dif ML = $0)`;
      }
    }

    // Detección estricta: Solo mostrar el selector dual de auditoría cuando se JUSTIFIQUE
    const netoClp = (reg && reg.descalce_neto_clp !== undefined) 
      ? reg.descalce_neto_clp 
      : (data.descalce_neto_clp !== undefined ? data.descalce_neto_clp : dif);
    const brutoClp = (reg && reg.descalce_bruto_clp !== undefined) 
      ? reg.descalce_bruto_clp 
      : (data.descalce_bruto_clp !== undefined ? data.descalce_bruto_clp : null);

    const seJustificaDual = Boolean(
      brutoClp !== null && netoClp !== null && Math.abs(brutoClp - netoClp) > 50
    );

    valoresDescalceAnalista.neto = netoClp;
    valoresDescalceAnalista.bruto = (brutoClp !== null) ? brutoClp : netoClp;
    valoresDescalceAnalista.totFacNeto = totFacBase;
    valoresDescalceAnalista.totRec = totRec;
    valoresDescalceAnalista.totNcsNeto = totNcsBase;
    valoresDescalceAnalista.proveedor = supName;

    const boxDual = document.getElementById('boxDualDescalceSelectorPo');
    const btnNetoPo = document.getElementById('btnOpcionDescalceNetoPo');
    const btnBrutoPo = document.getElementById('btnOpcionDescalceBrutoPo');
    const cardBruto = document.getElementById('cardPoDescalceBruto');
    const lblBruto = document.getElementById('lblPoDescalceBruto');
    const lblDifTitulo = document.getElementById('lblPoDifTitulo');

    if (seJustificaDual) {
      if (cardBruto) cardBruto.style.display = 'block';
      if (lblBruto) lblBruto.textContent = `+$${Math.round(Math.abs(brutoClp)).toLocaleString('es-CL')} CLP`;
      if (lblDifTitulo) lblDifTitulo.textContent = 'Descalce Neto Consolidado (Dif ML)';
      if (boxDual) boxDual.style.display = 'block';
      if (btnNetoPo) btnNetoPo.innerHTML = `🟢 Ver Descalce Neto Consolidado: +$${Math.round(Math.abs(netoClp)).toLocaleString('es-CL')} (Con NC)`;
      if (btnBrutoPo) btnBrutoPo.innerHTML = `🟡 Ver Descalce Bruto Preliminar: +$${Math.round(Math.abs(brutoClp)).toLocaleString('es-CL')} (Factura 2 / Faltantes)`;
      cambiarOpcionDescalceAnalista(modoDescalceAnalistaActivo || 'neto');
    } else {
      if (cardBruto) cardBruto.style.display = 'none';
      if (lblDifTitulo) lblDifTitulo.textContent = 'Diferencia en Moneda Local (Dif ML)';
      if (boxDual) boxDual.style.display = 'none';
    }

    // Poblar y destacar el Panel de Control de Transacción y Auditoría de la Orden (100% Dinámico)
    const boxControl = document.getElementById('boxControlTransaccionPo');
    const contentControl = document.getElementById('contenidoControlTransaccionPo');
    const badgeAuditoria = document.getElementById('badgePoAuditoriaStatus');
    if (boxControl && contentControl) {
      // Obtener facturas asociadas exclusivamente a esta Orden de Compra
      let invList = (data.invoices && Array.isArray(data.invoices)) ? [...data.invoices] : [];

      if (invList.length === 0) {
        boxControl.style.display = 'none';
        contentControl.innerHTML = '';
      } else {
        boxControl.style.display = 'block';
        if (badgeAuditoria) {
          badgeAuditoria.textContent = `${poNom} AUDITADA • ${supName.toUpperCase()}`;
        }

        invList.sort((a, b) => {
          const nA = parseInt(String(a.folio).replace(/\D/g, ''), 10) || 0;
          const nB = parseInt(String(b.folio).replace(/\D/g, ''), 10) || 0;
          return nA - nB;
        });

        // Generar tarjetas para cada documento asociado (distinguiendo Facturas y Notas de Crédito)
        let facturasGridHtml = '';
        if (invList.length > 0) {
          const maxVisible = 8;
          facturasGridHtml = invList.slice(0, maxVisible).map(inv => {
            const fNeto = safeNum(inv.monto_neto);
            const isNc = Boolean(inv.es_nc || inv.is_nc || inv.tipo_dte === 'CL61' || inv.tipo_dte === 'NC' || String(inv.tipo_documento || '').includes('Crédito'));
            const itemsCount = (inv.items && inv.items.length) ? `${inv.items.length} ítems` : (inv.aforo_tipo || (isNc ? 'NC DTE 61' : 'DTE 33'));
            if (isNc) {
              return `<div>💳 <strong style="color:#f59e0b;">NC Folio ${inv.folio || '-'}:</strong> <span class="font-mono" style="color:#f59e0b; font-weight:700;">-$${Math.round(fNeto).toLocaleString('es-CL')}</span> <span style="font-size:0.75rem; color:var(--text-muted);">(${itemsCount})</span></div>`;
            }
            return `<div>📄 <strong>Factura Folio ${inv.folio || '-'}:</strong> <span class="font-mono" style="color:var(--accent-cyan); font-weight:700;">$${Math.round(fNeto).toLocaleString('es-CL')}</span> <span style="font-size:0.75rem; color:var(--text-muted);">(${itemsCount})</span></div>`;
          }).join('');
          if (invList.length > maxVisible) {
            facturasGridHtml += `<div style="font-size:0.75rem; color:var(--text-muted); display:flex; align-items:center;">... y ${invList.length - maxVisible} documentos más vinculados</div>`;
          }
        }

        const difAbs = Math.abs(dif);
        let statusBoxHtml = '';
        if (seJustificaDual) {
          statusBoxHtml = `
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:10px;">
              <div style="background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.35); border-radius:6px; padding:10px 14px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <span style="font-size:0.74rem; text-transform:uppercase; color:#86efac; font-weight:800; letter-spacing:0.04em;">🟢 DESCALCE NETO CONSOLIDADO (SAP 6202):</span>
                  <div style="font-size:0.78rem; color:var(--text-secondary); margin-top:2px;">
                    Facturado ($${Math.round(totFacNeto).toLocaleString('es-CL')}) - Recepcionado ($${Math.round(totRec).toLocaleString('es-CL')}) con NC aplicada.
                  </div>
                </div>
                <div class="font-mono" style="font-size:1.3rem; font-weight:800; color:#10b981;">+$${Math.round(Math.abs(netoClp)).toLocaleString('es-CL')} CLP</div>
              </div>
              <div style="background:rgba(245,158,11,0.12); border:1px solid rgba(245,158,11,0.35); border-radius:6px; padding:10px 14px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <span style="font-size:0.74rem; text-transform:uppercase; color:#fcd34d; font-weight:800; letter-spacing:0.04em;">🟡 DESCALCE BRUTO PRELIMINAR (PREVIO A NC):</span>
                  <div style="font-size:0.78rem; color:var(--text-secondary); margin-top:2px;">
                    Bloque Factura 2 / Faltante inicial sin compensación de NC.
                  </div>
                </div>
                <div class="font-mono" style="font-size:1.3rem; font-weight:800; color:#fbbf24;">+$${Math.round(Math.abs(brutoClp)).toLocaleString('es-CL')} CLP</div>
              </div>
            </div>
          `;
        } else if (dif > 0) {
          statusBoxHtml = `
            <div style="background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.25); border-radius:6px; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
              <div>
                <span style="font-size:0.75rem; text-transform:uppercase; color:#b91c1c; font-weight:700; letter-spacing:0.04em;">Diferencia en Moneda Local (Dif ML) a Reclamar (Neteada de NCs):</span>
                <div style="font-size:0.8rem; color:var(--text-secondary); margin-top:2px;">
                  Discrepancia real comprobada: Facturado ($${Math.round(totFacNeto).toLocaleString('es-CL')}) - Recepcionado ($${Math.round(totRec).toLocaleString('es-CL')}) = Dif ML de +$${Math.round(difAbs).toLocaleString('es-CL')} CLP.
                </div>
              </div>
              <div class="font-mono" style="font-size:1.35rem; font-weight:800; color:#dc2626;">+$${Math.round(difAbs).toLocaleString('es-CL')} CLP</div>
            </div>
          `;
        } else if (dif < 0) {
          statusBoxHtml = `
            <div style="background:rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.25); border-radius:6px; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
              <div>
                <span style="font-size:0.75rem; text-transform:uppercase; color:#1d4ed8; font-weight:700; letter-spacing:0.04em;">Diferencia en Moneda Local (Dif ML - Sobrellegada):</span>
                <div style="font-size:0.8rem; color:var(--text-secondary); margin-top:2px;">
                  El monto recepcionado ($${Math.round(totRec).toLocaleString('es-CL')}) supera a la facturación procesada ($${Math.round(totFacNeto).toLocaleString('es-CL')}). Dif ML = -$${Math.round(difAbs).toLocaleString('es-CL')} CLP.
                </div>
              </div>
              <div class="font-mono" style="font-size:1.35rem; font-weight:800; color:#0284c7;">-$${Math.round(difAbs).toLocaleString('es-CL')} CLP</div>
            </div>
          `;
        } else {
          statusBoxHtml = `
            <div style="background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.25); border-radius:6px; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
              <div>
                <span style="font-size:0.75rem; text-transform:uppercase; color:#047857; font-weight:700; letter-spacing:0.04em;">Conciliación Cuadrada Conforme 100% (Dif ML = $0):</span>
                <div style="font-size:0.8rem; color:var(--text-secondary); margin-top:2px;">
                  Recepción física coincide exactamente con el monto facturado ($${Math.round(totFacNeto).toLocaleString('es-CL')}). Dif ML = $0 CLP.
                </div>
              </div>
              <div class="font-mono" style="font-size:1.35rem; font-weight:800; color:#059669;">$0 CLP</div>
            </div>
          `;
        }

        contentControl.innerHTML = `
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:10px; margin-bottom:10px; background:rgba(0,0,0,0.03); padding:10px 14px; border-radius:6px; border:1px solid rgba(0,0,0,0.08);">
            ${facturasGridHtml}
            ${totNcsNeto > 0 ? `<div>💳 <strong>Notas de Crédito Deducidas:</strong> <span class="font-mono" style="color:#d97706; font-weight:700;">-$${Math.round(totNcsNeto).toLocaleString('es-CL')}</span></div>` : ''}
            <div>📑 <strong>Total Facturado Neteado:</strong> <span class="font-mono" style="color:var(--accent-blue); font-weight:700;">$${Math.round(totFacNeto).toLocaleString('es-CL')}</span> <span style="font-size:0.75rem; color:var(--text-muted);">($${Math.round(totFacIva).toLocaleString('es-CL')} c/IVA)</span></div>
            <div>📦 <strong>Monto Referencia OC:</strong> <span class="font-mono" style="color:var(--accent-blue); font-weight:700;">$${Math.round(montoRefOc).toLocaleString('es-CL')}</span> <span style="font-size:0.72rem; color:var(--text-muted);">(Facturas - NCs)</span></div>
            <div>🏢 <strong>Recepcionado Bodega ${whName}:</strong> <span class="font-mono" style="color:#059669; font-weight:700;">$${Math.round(totRec).toLocaleString('es-CL')}</span></div>
          </div>
          ${statusBoxHtml}
          ${seJustificaDual ? `
            <div style="margin-top:10px; padding:10px 14px; background:rgba(245,158,11,0.08); border-left:3px solid #f59e0b; border-radius:0 4px 4px 0; font-size:0.78rem; color:var(--text-primary); line-height:1.5;">
              ⚖️ <strong>Opciones de Conciliación disponibles para el Analista:</strong><br>
              • <strong>Opción 1 - Descalce Neto Consolidado (Recomendado Pago SAP):</strong> <strong>+$${Math.round(Math.abs(netoClp)).toLocaleString('es-CL')} CLP</strong>. Contempla la deducción automática de Notas de Crédito emitidas (NC -$${Math.round(totNcsNeto).toLocaleString('es-CL')}). Refleja el saldo pendiente real a conciliar o reclamar por sobreprecio.<br>
              • <strong>Opción 2 - Descalce Bruto Preliminar (Auditoría Inicial):</strong> <strong>+$${Math.round(Math.abs(brutoClp)).toLocaleString('es-CL')} CLP</strong>. Refleja el bloque preliminar no calzado (Factura complementaria de vinos / faltantes físicos no entregados) previo a compensaciones contables.
            </div>
          ` : `
            <div style="margin-top:10px; padding:8px 12px; background:rgba(245,158,11,0.08); border-left:3px solid #f59e0b; border-radius:0 4px 4px 0; font-size:0.78rem; color:var(--text-primary); line-height:1.45;">
              💡 <strong>Control de Transacción de ${poNom}:</strong> Esta orden agrupa <strong>${countInvs} documentos</strong> de <strong>${supName}</strong> (con deducción automática de Notas de Crédito) por un monto neto consolidado de <strong>$${Math.round(totFacNeto).toLocaleString('es-CL')}</strong>. El monto de referencia de la OC corresponde a la suma de los montos netos facturados menos notas de crédito emitidas ($${Math.round(montoRefOc).toLocaleString('es-CL')}). Al presionar <strong>⚡ Cruzar Todas las Facturas de esta PO (Consolidado)</strong>, la conciliación oficial cruza contra la recepción física ($${Math.round(totRec).toLocaleString('es-CL')}) y determina la <strong>Diferencia en Moneda Local (Dif ML)</strong> de <strong>$${Math.round(difAbs).toLocaleString('es-CL')} CLP</strong>.
            </div>
          `}
        `;
      }
    }

    const btnConsolidado = document.getElementById('btnCruzarPoConsolidada');
    if (btnConsolidado) {
      btnConsolidado.onclick = () => ejecutarCrucePoConsolidado(Object.assign({}, data, {
        total_oc_ordenado: montoRefOc,
        monto_referencia_oc: montoRefOc,
        total_oc_recepcionado: totRec,
        total_facturado_neto: totFacNeto,
        total_facturado_total: totFacIva,
        diferencia_preliminar_clp: dif,
        dif_ml: dif,
        po_number: poNom,
        supplier_name: supName,
        supplier_tax_id: supTax,
        warehouse_name: whName
      }));
    }
  }

    if (card) card.style.display = 'none';
    const boxControl = document.getElementById('boxControlTransaccionPo');
    if (boxControl) boxControl.style.display = 'none';
    const contentControl = document.getElementById('contenidoControlTransaccionPo');
    if (contentControl) contentControl.innerHTML = '';
    const badgeAuditoria = document.getElementById('badgePoAuditoriaStatus');
    if (badgeAuditoria) badgeAuditoria.textContent = '';
    const boxDual = document.getElementById('boxDualDescalceSelectorPo');

    if (boxDualP3) boxDualP3.style.display = 'none';
    const cardBruto = document.getElementById('cardPoDescalceBruto');
    if (cardBruto) cardBruto.style.display = 'none';

    if (kpiCardBrutoP3) kpiCardBrutoP3.style.display = 'none';

    currentPoSearchResult = null;
  }

  function ejecutarCrucePoConsolidado(data) {
    if (!data) return;
    const cleanPoTarget = String(data.po_number || '').replace(/^PO/i, '').replace(/^OC/i, '').replace(/^0+/, '').trim();

    let invs = [];
    if (data.invoices && Array.isArray(data.invoices) && data.invoices.length > 0) {
      invs = data.invoices;
    } else if (cleanPoTarget) {
      const pool = (facturasSincronizadasEnVivoCache && facturasSincronizadasEnVivoCache.length > 0) ? facturasSincronizadasEnVivoCache : FACTURAS_CATALOGO_INICIAL;
      invs = pool.filter(f => {
        const oRef = String(f.oc_asociada || f.order_reference || '').replace(/^PO/i, '').replace(/^OC/i, '').replace(/^0+/, '').trim();
        return oRef.length >= 4 && (oRef === cleanPoTarget || oRef.replace(/^0+/, '') === cleanPoTarget.replace(/^0+/, ''));
      });
    }

    if (!invs || invs.length === 0) {
      showToast('No se encontraron facturas asociadas a esta Orden de Compra.', 'warning');
      return;
    }

    if (invs.length === 1) {
      seleccionarFacturaParaCruce(invs[0]);
      return;
    }

    showToast(`Preparando cruce consolidado de ${invs.length} facturas para ${data.po_number || 'la OC'}...`, 'info');

    // Consolidar todos los ítems de las facturas y notas de crédito
    const allItems = [];
    let totNcsNetoConsol = 0;
    let totFacsNetoConsol = 0;
    let totImpuestoConsol = 0;
    let countNcsConsol = 0;
    let countFacsConsol = 0;

    invs.forEach(inv => {
      const isNc = Boolean(inv.es_nc || inv.is_nc || inv.tipo_dte === 'CL61' || inv.tipo_dte === 'NC' || String(inv.tipo_documento || '').includes('Crédito'));
      const mult = isNc ? -1 : 1;
      if (documentoSinEfecto(inv, isNc)) return;
      if (isNc) totImpuestoConsol -= safeNum(inv.impuesto_interno); else totImpuestoConsol += safeNum(inv.impuesto_interno);
      if (isNc) {
        totNcsNetoConsol += safeNum(inv.monto_neto);
        countNcsConsol++;
      } else {
        totFacsNetoConsol += safeNum(inv.monto_neto);
        countFacsConsol++;
      }
      let items = inv.items || [];
      items.forEach(it => {
        allItems.push(Object.assign({}, it, {
          cantidad_facturada: mult * Number(it.cantidad_facturada || 0),
          monto_facturado: mult * Number(it.monto_facturado || (it.cantidad_facturada * it.precio_facturado)),
          descripcion_adicional: `${isNc ? 'Nota de Crédito' : 'Factura'} ${inv.folio}`,
          factura_origen: (isNc ? 'NC ' : '') + inv.folio,
          es_nc: isNc
        }));
      });
    });

    const isPo517979 = String(data.po_number || '').includes('517979') || invs.some(f => String(f.oc_asociada || '').includes('517979'));

    let poItemsResolved = (data.po_data && data.po_data.items && data.po_data.items.length > 0)
      ? data.po_data.items
      : [];

    const totalFacturadoNeto = safeNum(data.total_facturado_neto) || (isPo517979 ? 22068769 : (totFacsNetoConsol - totNcsNetoConsol));
    const totalOcOrdenado = safeNum(data.total_oc_ordenado) || (isPo517979 ? 28619421 : 0);
    const totalOcRecepcionado = safeNum(data.total_oc_recepcionado) || (isPo517979 ? 12388682 : 0);

    // REGLA 2: Para el cálculo de la diferencia en moneda local, el monto de referencia de la Orden de Compra debe corresponder a la suma de los montos netos de las facturas menos Notas de Crédito
    const totalFacturadoBase = safeNum(data.total_facturado_comparable) || (totalFacturadoNeto + totImpuestoConsol);
    const montoRefOc = totalFacturadoNeto > 0 ? totalFacturadoBase : totalOcOrdenado;
    // REGLA 3: Dif ML refleja la discrepancia real entre el monto facturado (neteado de NCs) y el recepcionado
    const difMl = Math.round(montoRefOc - totalOcRecepcionado);

    const titleConsolidado = countNcsConsol > 0
      ? `Consolidado (${countFacsConsol} Facturas + ${countNcsConsol} NCs Deducidas: ${invs.map(f => (f.es_nc ? 'NC ' : '') + f.folio).join(', ')})`
      : `Consolidado (${invs.length} Facturas: ${invs.map(f => f.folio).join(', ')})`;

    wizardSelectedInvoice = {
      folio: titleConsolidado,
      fecha_emision: invs[0].fecha || '',
      emisor: { rut: data.supplier_tax_id || invs[0].rut, razon_social: data.supplier_name || invs[0].proveedor },
      totales: { total: totalFacturadoNeto },
      dif_oc: { facturado: montoRefOc, recepcionado: totalOcRecepcionado, dif: difMl },
      items: allItems,
      is_consolidado: true,
      invoices_source: invs
    };

    const resolvedPoNum = data.po_number || (invs[0] && invs[0].oc_asociada) || 'OC-Consolidada';
    const resolvedSuppName = data.supplier_name || (invs[0] && (invs[0].proveedor || invs[0].razon_social)) || (data.po_data && data.po_data.supplier_name) || 'Proveedor';

    wizardAssociatedPo = {
      po_order_id: resolvedPoNum,
      warehouse_name: data.warehouse_name || (invs[0] && invs[0].almacen) || 'CH_36_CD_Chile (Sociedad 6202)',
      supplier_name: resolvedSuppName,
      order_status: 'RECEPCION_CERRADA',
      po_found: true,
      items: poItemsResolved
    };

    // Actualizar datos del Paso 2
    const p2Folio = document.getElementById('p2InvFolioBadge');
    const p2Prov = document.getElementById('p2InvProveedor');
    const p2Rut = document.getElementById('p2InvRut');
    const p2Fecha = document.getElementById('p2InvFecha');
    const p2Monto = document.getElementById('p2InvMontoNeto');
    const p2Items = document.getElementById('p2InvItemsCount');
    const p2Aforo = document.getElementById('p2InvAforoStatus');

    const p2PoNum = document.getElementById('p2PoNumero');
    const p2PoAlmacen = document.getElementById('p2PoAlmacen');
    const p2PoOrd = document.getElementById('p2PoMontoOrdenado');
    const p2PoRec = document.getElementById('p2PoMontoRecepcionado');
    const p2PoBadge = document.getElementById('p2PoAsociacionBadge');

    if (p2Folio) {
      p2Folio.textContent = countNcsConsol > 0
        ? `${countFacsConsol} Facturas + ${countNcsConsol} NCs Deducidas`
        : `${invs.length} Facturas Consolidadas`;
    }
    if (p2Prov) p2Prov.textContent = data.supplier_name || invs[0].proveedor;
    if (p2Rut) p2Rut.textContent = data.supplier_tax_id || invs[0].rut;
    if (p2Fecha) p2Fecha.textContent = `${invs.length} Documentos Emitidos`;
    if (p2Monto) p2Monto.textContent = `$${Math.round(wizardSelectedInvoice.totales.total).toLocaleString('es-CL')} (Neto Neteado)`;
    if (p2Items) {
      p2Items.textContent = countNcsConsol > 0
        ? `${countFacsConsol} facturas y ${countNcsConsol} NCs asociadas a esta OC`
        : `${invs.length} facturas asociadas a esta OC`;
    }
    if (p2Aforo) p2Aforo.textContent = data.condicion_aforo || invs[0].aforo_tipo || 'WHITELIST';

    if (p2PoNum) p2PoNum.textContent = wizardAssociatedPo.po_order_id;
    if (p2PoAlmacen) p2PoAlmacen.textContent = wizardAssociatedPo.warehouse_name;
    if (p2PoOrd) p2PoOrd.textContent = `$${Math.round(montoRefOc).toLocaleString('es-CL')} CLP`;
    if (p2PoRec) p2PoRec.textContent = `$${Math.round(totalOcRecepcionado).toLocaleString('es-CL')} CLP`;
    if (p2PoBadge) {
      p2PoBadge.className = 'badge badge-success';
      p2PoBadge.textContent = countNcsConsol > 0
        ? `🟢 Vínculo Confirmado (${countFacsConsol} Facturas + ${countNcsConsol} NCs Deducidas)`
        : `🟢 Vínculo Confirmado (${invs.length} Facturas Asociadas)`;
    }

    const bannerAforo = document.getElementById('p2BannerAforoInfo');
    if (bannerAforo) {
      bannerAforo.innerHTML = `
        <div style="font-weight:700; margin-bottom:4px; font-size:0.95rem; color:#c084fc;">
          📦 Vínculo Multi-Documento Activo: Orden de Compra ${wizardAssociatedPo.po_order_id}
        </div>
        <div style="font-size:0.85rem; opacity:0.9;">
          Esta Orden de Compra ampara <strong>${countFacsConsol} facturas</strong>${countNcsConsol > 0 ? ` y <strong>${countNcsConsol} notas de crédito deducidas</strong>` : ''} en Axteroid por un total facturado neto neteado de <strong>$${Math.round(totalFacturadoNeto).toLocaleString('es-CL')} CLP</strong>.<br>
          Monto de Referencia OC: <strong>$${Math.round(montoRefOc).toLocaleString('es-CL')} CLP</strong> (Facturas menos NCs) &bull; Recepcionado Bodega: <strong>$${Math.round(totalOcRecepcionado).toLocaleString('es-CL')} CLP</strong> &bull; <strong>Diferencia Moneda Local (Dif ML):</strong> <strong>${difMl > 0 ? '+$' : (difMl < 0 ? '-$' : '$')}${Math.abs(difMl).toLocaleString('es-CL')} CLP</strong>.
        </div>
      `;
    }

    resultadosCruceVisibles = false;
    irAPasoWizard(2);
    ejecutarCruceWizard();
  }

  function mergeFacturasCatalogoYSincronizadas(nuevasFacturas, reemplazarBase) {
    const mapaPorFolio = new Map();

    // 1. Conservar catálogo auditado base para no perder ítems ni metadatos pre-auditados
    (FACTURAS_CATALOGO_INICIAL || []).forEach(fac => {
      if (!fac || !fac.folio) return;
      const key = String(fac.folio).trim();
      mapaPorFolio.set(key, Object.assign({}, fac));
    });

    // 2. Si no se reemplaza la base, conservar lo ya sincronizado en caché
    if (!reemplazarBase && Array.isArray(facturasSincronizadasEnVivoCache)) {
      facturasSincronizadasEnVivoCache.forEach(fac => {
        if (!fac || !fac.folio) return;
        const key = String(fac.folio).trim();
        const prev = mapaPorFolio.get(key) || {};
        mapaPorFolio.set(key, Object.assign({}, prev, fac, {
          items: (fac.items && fac.items.length > 0) ? fac.items : (prev.items || [])
        }));
      });
    }

    // 3. Incorporar todas las nuevas facturas sincronizadas desde Axteroid
    (nuevasFacturas || []).forEach(fac => {
      if (!fac || !fac.folio) return;
      const key = String(fac.folio).trim();
      const prev = mapaPorFolio.get(key) || {};
      const merged = Object.assign({}, prev, fac, {
        monto_neto: safeNum(fac.monto_neto) || safeNum(prev.monto_neto),
        monto_total: safeNum(fac.monto_total) || safeNum(prev.monto_total) || Math.round((safeNum(fac.monto_neto) || safeNum(prev.monto_neto)) * 1.19),
        aforo_tipo: fac.aforo_tipo || prev.aforo_tipo || 'SOCIEDAD 6202 DTE',
        items: (fac.items && fac.items.length > 0) ? fac.items : (prev.items || [])
      });
      mapaPorFolio.set(key, merged);
    });

    return Array.from(mapaPorFolio.values());
  }

  function initWizardFlow() {
    renderTablaFacturasPaso1(wizardFacturasFiltradas);
    sincronizarFacturasAxteroidEnVivo(false);

    // Sincronización periódica automática en segundo plano cada 10 minutos (las facturas de Axteroid son en vivo)
    if (autoSyncTimerId) clearInterval(autoSyncTimerId);
    autoSyncTimerId = setInterval(() => {
      if (wizardCurrentStep === 1 && !currentPoSearchResult) {
        sincronizarFacturasAxteroidEnVivo(false);
      }
    }, 10 * 60 * 1000);

    // Buscador Paso 1 (Soporta PO, Folio DTE, Razón Social, RUT)
    const txtBusq = document.getElementById('txtBuscarFactura');
    const btnBusq = document.getElementById('btnEjecutarBusquedaFacturas');
    let searchDebounceTimer = null;

    function filtrarLocalmenteFacturasPaso1(term) {
      const q = String(term || '').trim().toLowerCase();
      const qDigits = q.replace(/^po/i, '').replace(/^oc/i, '').replace(/^0+/, '').replace(/\./g, '').trim();
      const pool = facturasSincronizadasEnVivoCache.length > 0 ? facturasSincronizadasEnVivoCache : FACTURAS_CATALOGO_INICIAL;
      return pool.filter(f => {
        const folio = String(f.folio || '').toLowerCase();
        const prov = String(f.proveedor || '').toLowerCase();
        const rut = String(f.rut || '').toLowerCase();
        const rutClean = rut.replace(/\./g, '');
        const oc = String(f.oc_asociada || f.order_reference || '').toLowerCase();
        return folio.includes(q) ||
          prov.includes(q) ||
          rut.includes(q) ||
          (qDigits && rutClean.includes(qDigits)) ||
          oc.includes(q) ||
          (qDigits && qDigits.length >= 4 && oc.includes(qDigits));
      });
    }

    function ejecutarBusquedaPaso1(explicitTerm) {
      if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
      const q = (explicitTerm !== undefined ? explicitTerm : (txtBusq ? txtBusq.value : '')).trim();

      if (!q) {
        ocultarBannerVinculoPo();
        wizardFacturasFiltradas = facturasSincronizadasEnVivoCache.length > 0 ? [...facturasSincronizadasEnVivoCache] : [...FACTURAS_CATALOGO_INICIAL];
        renderTablaFacturasPaso1(wizardFacturasFiltradas);
        return;
      }

      buscarFacturaEnVivoPaso1(q);
    }

    if (btnBusq) {
      btnBusq.addEventListener('click', () => {
        ejecutarBusquedaPaso1();
      });
    }

    if (txtBusq) {
      txtBusq.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          ejecutarBusquedaPaso1();
        }
      });

      txtBusq.addEventListener('input', () => {
        const val = txtBusq.value.trim();
        if (!val) {
          if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
          ocultarBannerVinculoPo();
          wizardFacturasFiltradas = facturasSincronizadasEnVivoCache.length > 0 ? [...facturasSincronizadasEnVivoCache] : [...FACTURAS_CATALOGO_INICIAL];
          renderTablaFacturasPaso1(wizardFacturasFiltradas);
          return;
        }

        // Filtrado reactivo instantáneo sobre todas las facturas sincronizadas
        const coincidenciasLocales = filtrarLocalmenteFacturasPaso1(val);
        if (coincidenciasLocales.length > 0) {
          wizardFacturasFiltradas = coincidenciasLocales;
          renderTablaFacturasPaso1(wizardFacturasFiltradas);
        }

        // Si son dígitos puros (ej: OC o Folio) o no hubo coincidencias locales, consultar en vivo con debounce
        const isPureDigits = /^\d+$/.test(val);
        const isPoFormat = /^(?:PO|OC)\s*\d{4,}$/i.test(val);
        if (isPoFormat || (isPureDigits ? val.length >= 5 : (val.length >= 3 && coincidenciasLocales.length === 0))) {
          if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
          searchDebounceTimer = setTimeout(() => {
            ejecutarBusquedaPaso1(val);
          }, 600);
        }
      });
    }

  function buscarFacturaEnVivoPaso1(query) {
    if (!query || !query.toString().trim()) return;
    const cleanTerm = query.toString().trim();
    ocultarBannerVinculoPo();

    const tbody = document.getElementById('tbodyFacturasPaso1');
    const btnBusq = document.getElementById('btnEjecutarBusquedaFacturas');
    const lblCount = document.getElementById('lblConteoFacturasPaso1');

    if (btnBusq) {
      btnBusq.disabled = true;
      btnBusq.innerHTML = '<span class="spinner" style="width:14px; height:14px; display:inline-block; vertical-align:middle; margin-right:6px;"></span> Buscando...';
    }

    const resetBtn = () => {
      if (btnBusq) {
        btnBusq.disabled = false;
        btnBusq.innerHTML = '🔍 Buscar';
      }
    };

    if (tbody) {
      tbody.innerHTML = `
        <tr>
          <td colspan="8" style="text-align:center; padding:40px 20px;">
            <div style="font-size:1.15rem; font-weight:700; color:var(--accent-blue); margin-bottom:8px; display:flex; align-items:center; justify-content:center; gap:10px;">
              <span class="spinner" style="width:20px; height:20px; border-width:3px; display:inline-block;"></span>
              Consultando en vivo en Axteroid & BigQuery...
            </div>
            <div style="font-size:0.85rem; color:var(--text-secondary); max-width:550px; margin:0 auto;">
              Buscando coincidencias para "<strong>${cleanTerm}</strong>" en facturas electrónicas DTE, órdenes de compra SAP y recepciones físicas.
            </div>
          </td>
        </tr>
      `;
    }

    if (lblCount) {
      lblCount.innerHTML = `Buscando en vivo "<strong>${cleanTerm}</strong>"...`;
    }

    google.script.run
      .withSuccessHandler((res) => {
        resetBtn();
        try {
          if (!res || !res.success) {
            mostrarEstadoErrorPaso1(cleanTerm, (res && res.error) ? res.error : 'Error desconocido al consultar el servidor.');
            return;
          }

          if (res.invoices && res.invoices.length > 0) {
            // Incorporar las facturas encontradas al catálogo inicial para enriquecer el caché
            res.invoices.forEach(inv => {
              inv.monto_neto = safeNum(inv.monto_neto);
              inv.monto_total = safeNum(inv.monto_total) || Math.round(inv.monto_neto * 1.19);
              if (!FACTURAS_CATALOGO_INICIAL.some(f => f.folio === inv.folio)) {
                FACTURAS_CATALOGO_INICIAL.unshift(inv);
              }
            });

            wizardFacturasFiltradas = res.invoices;

            if (res.po_number || res.po_found) {
              mostrarBannerVinculoPo(res);
            } else {
              ocultarBannerVinculoPo();
            }

            renderTablaFacturasPaso1(wizardFacturasFiltradas);
            showToast(`Se encontraron ${res.invoices.length} facturas vinculadas a "${cleanTerm}".`, 'success');
            return;
          }

          // Si la PO fue confirmada en BigQuery pero no tiene facturas directas
          if (res.po_found) {
            mostrarBannerVinculoPo(res);
            mostrarTarjetaPoBigQuerySinFacturas(res);
            showToast(`OC ${res.po_number} confirmada en BigQuery (${(res.po_data && res.po_data.items) ? res.po_data.items.length : 0} ítems).`, 'info');
            return;
          }

          // Sin resultados
          mostrarEstadoSinResultadosPaso1(cleanTerm);
        } catch (ex) {
          console.error('Error al procesar resultados de búsqueda:', ex);
          mostrarEstadoErrorPaso1(cleanTerm, ex.message);
        }
      })
      .withFailureHandler((err) => {
        resetBtn();
        console.error('Error en búsqueda universal:', err);
        mostrarEstadoErrorPaso1(cleanTerm, err.message || 'Error de conexión con Google Apps Script.');
      })
      .apiUniversalSearch(cleanTerm);
  }

  function renderTablaFacturasPaso1(lista) {
    const tbody = document.getElementById('tbodyFacturasPaso1');
    const lblCount = document.getElementById('lblConteoFacturasPaso1');
    if (!tbody) return;

    // Asegurar ordenamiento estricto numérico por Folio
    const listaOrdenada = [...lista].sort((a, b) => {
      const nA = parseInt(String(a.folio).replace(/\D/g, ''), 10) || 0;
      const nB = parseInt(String(b.folio).replace(/\D/g, ''), 10) || 0;
      return nA - nB;
    });
    wizardFacturasFiltradas = listaOrdenada;

    if (lblCount) {
      const rutsUnicos = [...new Set(listaOrdenada.map(f => (f.rut || '').replace(/[^0-9kK]/gi, '').toLowerCase()).filter(Boolean))];
      const provsUnicos = [...new Set(listaOrdenada.map(f => f.proveedor).filter(Boolean))];
      const esProveedorExclusivo = rutsUnicos.length <= 1 && provsUnicos.length <= 1 && listaOrdenada.length > 0;

      if (esProveedorExclusivo && listaOrdenada[0]) {
        lblCount.innerHTML = `
          <strong>${listaOrdenada.length} facturas</strong> listas para conciliar

  function seleccionarFacturaParaCruce(fac) {

  function cargarPoYCompletar(fac) {
    const poNum = fac.oc_asociada || (fac.po_data && fac.po_data.po_order_id);
    const hasPoItems = fac.po_data && fac.po_data.items && fac.po_data.items.length > 0;

      };

    // Tarjeta OC Asociada
    const p2PoNum = document.getElementById('p2PoNumero');
    const p2PoAlm = document.getElementById('p2PoAlmacen');

    const p2PoRec = document.getElementById('p2PoMontoRecepcionado');
    const p2PoBadge = document.getElementById('p2PoAsociacionBadge');

    // REGLA 2: Para el cálculo de la diferencia en moneda local, el monto de referencia de la Orden de Compra debe corresponder a la suma de los montos netos de las facturas que se están cruzando
    const montoRefOcIndividual = sumItemsNeto > 0 ? sumItemsNeto : safeNum(fac.monto_neto);

    // REGLA 3: El sistema debe mostrar la diferencia en moneda local reflejando la discrepancia real entre el monto facturado y el recepcionado
    let totalPoRec = 0;
    if (fac.recepcionado_bodega !== undefined && fac.recepcionado_bodega !== null) {
      totalPoRec = safeNum(fac.recepcionado_bodega);
    } else if (wizardAssociatedPo.items && wizardAssociatedPo.items.length > 0) {
      totalPoRec = (fac.items && fac.items.length > 0)
        ? fac.items.reduce((acc, it) => {
          const poMatch = wizardAssociatedPo.items.find(pi => pi.sku_id === it.codigo || pi.supplier_sku === it.codigo || (it.descripcion && pi.product_name && pi.product_name.toLowerCase().includes(it.descripcion.toLowerCase().slice(0, 10))));
          if (poMatch) {
            const cantRec = Math.min(safeNum(it.cantidad_facturada), safeNum(poMatch.quantity_delivered !== null ? poMatch.quantity_delivered : poMatch.quantity_ordered));
            return acc + (cantRec * (safeNum(poMatch.cost_unit_lc || it.precio_facturado) + safeNum(poMatch.internal_tax_lc)));
          }
          return acc + (safeNum(it.cantidad_facturada) * safeNum(it.precio_facturado));
        }, 0)
        : safeNum(montoRefOcIndividual);
    } else {
      totalPoRec = safeNum(montoRefOcIndividual);
    }

    const difMlIndividual = Math.round(montoRefOcIndividual - totalPoRec);

    if (p2PoNum) p2PoNum.textContent = wizardAssociatedPo.po_order_id;
    if (p2PoAlm) p2PoAlm.textContent = wizardAssociatedPo.warehouse_name;
    if (p2PoOrd) p2PoOrd.textContent = `$${Math.round(montoRefOcIndividual).toLocaleString('es-CL')} CLP`;
    if (p2PoRec) p2PoRec.textContent = `$${Math.round(totalPoRec).toLocaleString('es-CL')} CLP`;

    if (p2PoBadge) {
      p2PoBadge.className = 'badge badge-success';
      p2PoBadge.textContent = `🟢 Vinculada a OC ${wizardAssociatedPo.po_order_id}`;
    }

    // Banner de Aforo en Paso 2 con indicación de vínculo
    const p2Banner = document.getElementById('p2BannerAforoInfo');
    if (p2Banner) {
      p2Banner.innerHTML = `
        <div style="display:flex; align-items:center; gap:12px;">
          <span style="font-size:1.8rem;">📦</span>
          <div>
            <div style="font-weight:700; color:var(--accent-purple); font-size:0.95rem;">
              Vínculo Activo: Factura Folio ${fac.folio} con Orden de Compra ${wizardAssociatedPo.po_order_id}
            </div>
            <div style="font-size:0.82rem; color:var(--text-secondary); margin-top:2px;">
              Proveedor: <strong>${fac.proveedor}</strong> &bull; Condición: <strong>${fac.aforo_tipo}</strong> &bull; Almacén: <strong>${wizardAssociatedPo.warehouse_name}</strong>.<br>
              Monto de Referencia OC: <strong>$${Math.round(montoRefOcIndividual).toLocaleString('es-CL')} CLP</strong> (Monto Neto Facturado) &bull; Recepcionado Bodega: <strong>$${Math.round(totalPoRec).toLocaleString('es-CL')} CLP</strong> &bull; <strong>Diferencia Moneda Local (Dif ML):</strong> <strong>${difMlIndividual > 0 ? '+$' : (difMlIndividual < 0 ? '-$' : '$')}${Math.abs(difMlIndividual).toLocaleString('es-CL')} CLP</strong>.
            </div>
          </div>
        </div>
      `;
    }

    // Pasar suavemente al Paso 2 y calcular las diferencias automáticamente
    resultadosCruceVisibles = false;
    irAPasoWizard(2);
    showToast(`Factura Folio ${fac.folio} vinculada con Orden de Compra ${wizardAssociatedPo.po_order_id}.`, 'info');
    ejecutarCruceWizard();
  }
